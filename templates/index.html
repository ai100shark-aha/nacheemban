let counselDB=null, counselLoading=false, counselQuery='', counselResults=[], counselActiveScenario=null, counselActiveSection=null;

async function loadCounselDB(){
  if(counselDB||counselLoading) return;
  counselLoading=true;
  try{
    const r=await fetch('/static/data/counseling_db_v2.json');
    counselDB=await r.json();
    console.log('상담DB 로드:',counselDB.meta.total_chunks,'청크');
  }catch(e){console.error('상담DB 로드 실패:',e)}
  counselLoading=false;
}

function searchCounsel(q){
  if(!counselDB||!q.trim()) return [];
  const terms=q.toLowerCase().split(/\s+/).filter(t=>t.length>0);
  const scored=counselDB.chunks.map(c=>{
    let score=0;
    const txt=(c.text||'').toLowerCase();
    const kws=(c.keywords||[]).map(k=>k.toLowerCase());
    const secTitle=((c.section||{}).section_title||'').toLowerCase();
    for(const t of terms){
      // 키워드 매칭 (높은 가중치)
      if(kws.some(k=>k.includes(t))) score+=10;
      // 섹션 제목 매칭
      if(secTitle.includes(t)) score+=5;
      // 본문 매칭
      const idx=txt.indexOf(t);
      if(idx!==-1){
        score+=3;
        // 앞부분에 나올수록 가산
        if(idx<200) score+=2;
      }
    }
    return {chunk:c, score};
  }).filter(x=>x.score>0);
  scored.sort((a,b)=>b.score-a.score);
  return scored.slice(0,15);
}

function getChunksBySection(secId){
  if(!counselDB) return [];
  return counselDB.chunks.filter(c=>c.section&&c.section.section_id===secId);
}

function highlightText(text, query, maxLen=400){
  if(!query.trim()) return text.slice(0,maxLen)+'...';
  const terms=query.toLowerCase().split(/\s+/).filter(t=>t);
  const lower=text.toLowerCase();
  let bestIdx=0, bestScore=0;
  for(let i=0;i<lower.length-100;i+=50){
    let s=0;
    const window=lower.slice(i,i+maxLen);
    for(const t of terms) if(window.includes(t)) s++;
    if(s>bestScore){bestScore=s;bestIdx=i}
  }
  let excerpt=text.slice(bestIdx,bestIdx+maxLen);
  if(bestIdx>0) excerpt='...'+excerpt;
  if(bestIdx+maxLen<text.length) excerpt+='...';
  for(const t of terms){
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
    excerpt=excerpt.replace(re,'<mark>$1</mark>');
  }
  return excerpt;
}

// PDF.js로 텍스트 추출
async function extractPdfText(file, progressCb) {
  // PDF.js CDN 동적 로드
  if(!window.pdfjsLib) {
    await new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
      s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }

  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const totalPages = pdf.numPages;
  let fullText = '';

  for(let i = 1; i <= totalPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    // 텍스트 아이템을 줄 단위로 재구성 (y좌표 기준)
    const items = content.items;
    const lines = {};
    items.forEach(item => {
      const y = Math.round(item.transform[5]);
      if(!lines[y]) lines[y] = [];
      lines[y].push(item.str);
    });
    const sortedY = Object.keys(lines).sort((a,b) => b-a);
    sortedY.forEach(y => { fullText += lines[y].join(' ') + '\n'; });
    fullText += '\n';
    if(progressCb) progressCb(Math.round(i/totalPages*60));
  }
  return fullText;
}

function parseAdmissionResult(text) {
  const results = [];
  
  // 지역 매핑
  const regionMap = {
    '서울': '서울', '경기': '경인', '인천': '경인',
    '강원': '강원', '충북': '충청', '충남': '충청', '세종': '충청', '대전': '충청',
    '전북': '호남', '전남': '호남', '광주': '호남',
    '대구': '대경', '경북': '대경', '부산': '동남', '경남': '동남', '울산': '동남',
    '제주': '제주'
  };

  // 의약계열 학과 분류
  const gradeKeyMap = {
    '의예': ['의예과', '의학과', '의학부', '의과대학'],
    '치의예': ['치의예과', '치의학과'],
    '한의예': ['한의예과', '한의학과'],
    '수의예': ['수의예과'],
    '약학': ['약학과', '약학부', '약과학과'],
    '간호': ['간호학과', '간호학부'],
    '물리치료': ['물리치료학과', '물리치료과'],
    '방사선': ['방사선학과', '방사선과'],
    '임상병리': ['임상병리학과', '임상병리과'],
    '응급구조': ['응급구조학과', '응급구조과'],
    '작업치료': ['작업치료학과', '작업치료과'],
    '치위생': ['치위생학과', '치위생과'],
  };

  function getGradeKey(deptName) {
    for(const [key, names] of Object.entries(gradeKeyMap)) {
      if(names.some(n => deptName.includes(n.replace('과','').replace('학','')))) return key;
    }
    return null;
  }

  // 전체 텍스트를 대학 블록으로 분리
  // 패턴: "지역 대학명" 또는 "대입 수시모집 입시결과" 이후
  const univHeaderRe = /(?:대입\s+수시모집\s+입시결과\s*\n+|^\s*)([가-힣]{2,4})\s+((?:[가-힣\w]+대학교[\w\s\(\)]*?))\s*\n/gm;
  const pgHeaderRe = /\[(\d{4})학년도\]\s*(학생부(?:종합|교과)\s*[\(\（][^）\)]+[\)）])/g;
  const dataRowRe = /^([가-힣·\/\-\s\w]+?(?:학과|학부|전공|대학|과|부))\s+(\d{1,4})\s+([\d.]+)\s+\d+\s+[\d.,]+\s+[\d.,]+\s+[\d,]+\s+([\d.]+)\s+([\d.]+)/m;
  const simpleDataRe = /^([가-힣·\/\-\s\w]+?(?:학과|학부|전공|대학|과))\s+(\d{1,4})\s+([\d.]+)\s+(\d+)\s+([\d.]+)\s+([\d.]+)/m;

  // 대학별로 분할
  const blocks = text.split(/(?=\d+\.\s*대입\s+수시모집|(?:^|\n)[가-힣]{2,4}\s+[가-힣]{2,}대학교)/m);

  let currentUniv = null;
  let currentPg = null;
  const univMap = {};

  const lines = text.split('\n');
  let i = 0;

  while(i < lines.length) {
    const line = lines[i].trim();

    // 대학 헤더 감지: "지역 대학교명"
    const univMatch = line.match(/^([가-힣]{2,4})\s+((?:[가-힣\w]+대학교[\w\s\(\)（）]*?))\s*$/);
    if(univMatch && !line.includes('학생부') && !line.includes('전형')) {
      const regionName = univMatch[1];
      const univName = univMatch[2].trim();
      const rg = regionMap[regionName] || '기타';

      if(!univMap[univName]) {
        univMap[univName] = {nm: univName, rg, lc: regionName, tp: '', pg: []};
      }
      currentUniv = univMap[univName];
      currentPg = null;
      i++; continue;
    }

    // 전형 헤더 감지
    const pgMatch = line.match(/\[(\d{4})학년도\]\s*(학생부(?:종합|교과)\s*[\(\（][^）\)]{2,30}[\)）])/);
    if(pgMatch && currentUniv) {
      const pgName = pgMatch[2].trim()
        .replace(/\s+/g, '')
        .replace(/（/g, '(').replace(/）/g, ')');
      const isJonghap = pgName.includes('종합');
      if(isJonghap) { // 학생부종합만 처리
        currentPg = {n: pgName, q: 0, m: '', iv: 0, mn: '미적용', dept: [], _grades: {}};
        currentUniv.pg.push(currentPg);
      } else {
        currentPg = null; // 교과전형 스킵
      }
      i++; continue;
    }

    // 데이터 행 파싱 (학과명 + 숫자들)
    if(currentUniv && currentPg) {
      // 형식: 학과명 모집인원 경쟁률 충원 환산50 환산70 총점 등급50 등급70
      const m1 = line.match(/^([가-힣·\/\-\(\)\s\w]+?(?:학과|학부|전공|대학|과))\s+(\d{1,4})\s+([\d.]+)\s+\d+\s+[\d,. ]+\s+([\d.]+)\s+([\d.]+)\s*$/);
      // 형식: 학과명 모집인원 경쟁률 충원 등급50 등급70 (간단형)
      const m2 = line.match(/^([가-힣·\/\-\(\)\s\w]+?(?:학과|학부|전공|대학|과))\s+(\d{1,4})\s+([\d.]+)\s+\d+\s+([\d.]+)\s+([\d.]+)\s*$/);

      const match = m1 || m2;
      if(match) {
        const deptName = match[1].trim();
        const quota = parseInt(match[2]);
        const cr = parseFloat(match[3]);
        const grade50 = parseFloat(match[4]);
        const grade70 = parseFloat(match[5]);
        const avgGrade = grade70 || grade50; // 70%cut 우선

        if(avgGrade > 0 && avgGrade < 9 && quota > 0) {
          // 학과 추가
          currentPg.dept.push({d: deptName, q: quota, cr: cr || undefined});
          currentPg.q += quota;

          // grades 분류
          const gKey = getGradeKey(deptName);
          if(gKey) {
            currentPg._grades[gKey] = {avg: avgGrade, fill: quota};
          } else if(deptName.includes('인문') || /국어|영어|사학|철학|사회|경영|경제|법학|행정|언론/.test(deptName)) {
            if(!currentPg._grades['인문'] || currentPg._grades['인문'].avg > avgGrade)
              currentPg._grades['인문'] = {avg: avgGrade, fill: quota};
          } else {
            if(!currentPg._grades['자연'] || currentPg._grades['자연'].avg > avgGrade)
              currentPg._grades['자연'] = {avg: avgGrade, fill: quota};
          }
        }
      }
    }

    i++;
  }

  // 후처리: grades 정리, dept 없는 전형 처리
  Object.values(univMap).forEach(univ => {
    univ.pg = univ.pg.map(pg => {
      const result = {...pg};
      delete result._grades;
      if(Object.keys(pg._grades).length > 0) result.grades = pg._grades;
      if(result.dept.length === 0) delete result.dept;
      if(result.q === 0) delete result.q;
      return result;
    }).filter(pg => pg.dept || pg.grades); // 데이터 없는 전형 제거
    
    if(univ.pg.length === 0) return;
    results.push(univ);
  });

  return results;
}

window.extractPdfWithAI = async function() {
  if(!window._pendingPdf) {
    alert('먼저 PDF 파일을 선택해주세요.');
    document.getElementById('pdfFileInput').click();
    return;
  }

  const btn = document.getElementById('pdfExtractBtn');
  const progress = document.getElementById('pdfProgress');
  const progressMsg = document.getElementById('pdfProgressMsg');
  const progressBar = document.getElementById('pdfProgressBar');
  const resultDiv = document.getElementById('pdfResult');

  btn.disabled = true;
  progress.style.display = 'block';
  resultDiv.style.display = 'none';
  progressBar.style.background = '';

  try {
    // 1단계: PDF.js 로드 + 텍스트 추출
    progressMsg.textContent = '📄 PDF 텍스트 추출 중... (파일 크기에 따라 10~30초 소요)';
    progressBar.style.width = '10%';

    const fullText = await extractPdfText(window._pendingPdf, (pct) => {
      progressBar.style.width = pct + '%';
      progressMsg.textContent = `📄 PDF 읽는 중... ${pct}%`;
    });

    progressBar.style.width = '65%';
    progressMsg.textContent = '🔍 전형 정보 파싱 중...';

    // 2단계: 파싱
    await new Promise(r => setTimeout(r, 50)); // UI 업데이트
    const extracted = parseAdmissionResult(fullText);

    if(extracted.length === 0) {
      // 파싱 실패 시 텍스트 미리보기 제공
      throw new Error(`전형 정보를 자동으로 찾지 못했습니다.\n\n이 PDF는 대교협 전형결과 표준 형식이 아닐 수 있습니다.\n아래 "JSON 직접 업로드" 방식을 이용하거나,\n"기여하기" 탭에서 직접 입력해주세요.\n\n[추출된 텍스트 샘플]\n${fullText.slice(0,300)}`);
    }

    progressBar.style.width = '85%';
    progressMsg.textContent = '🔀 DB 병합 중...';

    // 3단계: DB 병합
    let added = 0, updated = 0;
    extracted.forEach(newUniv => {
      const idx = UNIV_DB.findIndex(u => u.nm === newUniv.nm);
      if(idx >= 0) {
        newUniv.pg?.forEach(newPg => {
          const pgIdx = UNIV_DB[idx].pg.findIndex(p => p.n === newPg.n);
          if(pgIdx >= 0) {
            Object.keys(newPg).forEach(k => { if(newPg[k] !== undefined) UNIV_DB[idx].pg[pgIdx][k] = newPg[k]; });
          } else {
            UNIV_DB[idx].pg.push(newPg);
          }
        });
        updated++;
      } else {
        UNIV_DB.push(newUniv);
        added++;
      }
    });

    // 서버 업로드 시도
    try {
      await fetch('/api/db/update/', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(UNIV_DB)
      });
    } catch(e) {}

    progressBar.style.width = '100%';
    progressMsg.textContent = '✅ 완료!';

    const now = new Date().toISOString().split('T')[0];
    const summary = extracted.map(u => u.nm).join(', ');
    dbLog.push(`[${now}] 📄 PDF 추출: ${summary} → ${added}개 추가, ${updated}개 갱신`);

    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `
      <div style="padding:12px;border-radius:8px;background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2);font-size:.78rem">
        <div style="color:var(--green);font-weight:600;margin-bottom:6px">✅ 추출 완료! (API 비용 없음 🎉)</div>
        <div style="color:var(--text2)">
          <b>${extracted.length}개 대학</b> →
          <b style="color:var(--green)">${added}개 신규</b>,
          <b style="color:var(--accent)">${updated}개 갱신</b>
        </div>
        <div style="margin-top:4px;color:var(--text3);font-size:.72rem">${summary}</div>
        <div style="margin-top:8px;font-size:.72rem;color:var(--text3)">
          추출된 전형 수: ${extracted.reduce((s,u) => s + u.pg.length, 0)}개
        </div>
        <button onclick="document.getElementById('pdfJsonPreview').style.display=document.getElementById('pdfJsonPreview').style.display==='none'?'block':'none'" class="db-btn" style="margin-top:8px;font-size:.7rem;padding:4px 8px">추출된 JSON 확인</button>
        <pre id="pdfJsonPreview" style="display:none;margin-top:8px;font-size:.62rem;color:var(--text3);overflow:auto;max-height:200px;background:rgba(0,0,0,.2);padding:8px;border-radius:6px">${JSON.stringify(extracted, null, 2).slice(0, 4000)}</pre>
      </div>`;

    window._pendingPdf = null;
    document.getElementById('pdfDropLabel').textContent = 'PDF 파일을 드래그하거나 클릭하여 선택';
    document.getElementById('pdfDropLabel').style.color = '';
    document.getElementById('pdfFileInput').value = '';

  } catch(err) {
    progressBar.style.background = 'var(--red)';
    progressMsg.textContent = '❌ 오류';
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = `<div style="padding:10px;border-radius:8px;background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2);font-size:.75rem;color:var(--red);white-space:pre-wrap">${err.message}</div>`;
  } finally {
    btn.disabled = false;
  }
};

function loadJSON(file){
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data))throw new Error('JSON이 배열이 아닙니다');
      if(!data[0]||!data[0].nm||!data[0].pg)throw new Error('올바른 DB 형식이 아닙니다 (nm, pg 필드 필요)');
      UNIV_DB=data;
      const now=new Date().toISOString().split('T')[0];
      dbMeta={version:file.name.replace('.json',''),date:now,source:file.name,count:data.length};
      // 서버에 저장
      fetch('/api/db/update/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
        .then(r=>r.json()).then(r=>dbLog.push('['+now+'] 서버 저장: '+r.message))
        .catch(e=>dbLog.push('['+now+'] 서버 저장 실패: '+e.message));
      const pc=data.reduce((s,u)=>s+u.pg.length,0);
      dbLog.push(`[${now}] ✅ DB 업데이트 완료: ${data.length}개 대학, ${pc}개 전형 (${file.name})`);
      render();
    }catch(err){
      dbLog.push(`[${new Date().toISOString().split('T')[0]}] ❌ 오류: ${err.message}`);
      render();
    }
  };
  reader.readAsText(file);
}

window._pendingFile=null;
window.mergeUpload=function(){
  if(!window._pendingFile){
    alert('먼저 위 업로드 영역에서 JSON 파일을 선택하세요.\n파일 선택 후 "병합 업로드" 버튼을 다시 눌러주세요.');
    document.getElementById('fileInput').click();
    return;
  }
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(!Array.isArray(data)) throw new Error('JSON이 배열이 아닙니다');
      let added=0,updated=0;
      data.forEach(newU=>{
        const idx=UNIV_DB.findIndex(u=>u.nm===newU.nm);
        if(idx>=0){
          UNIV_DB[idx]=newU;
          updated++;
        } else {
          UNIV_DB.push(newU);
          added++;
        }
      });
      const now=new Date().toISOString().split('T')[0];
      dbMeta.date=now;
      dbMeta.version=`병합_${now}`;
      // 서버에 병합 저장
      fetch('/api/db/merge/',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
        .then(r=>r.json()).then(r=>dbLog.push('['+now+'] 서버 병합: '+r.message))
        .catch(e=>dbLog.push('['+now+'] 서버 병합 실패'));
      dbLog.push(`[${now}] 🔀 병합 완료: ${added}개 추가, ${updated}개 갱신 (${window._pendingFile.name})`);
      window._pendingFile=null;
      render();
    }catch(err){
      dbLog.push(`[${new Date().toISOString().split('T')[0]}] ❌ 병합 오류: ${err.message}`);
      render();
    }
  };
  reader.readAsText(window._pendingFile);
};
