
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>입시 나침반 — 선택과목 ↔ 학과 ↔ 대학</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
:root{--bg:#0a0f1c;--card:#111827;--card2:#1a2236;--border:#1e293b;--accent:#38bdf8;--accent2:#818cf8;--accent3:#f472b6;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--green:#34d399;--amber:#fbbf24;--red:#f87171;--radius:12px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard Variable','Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.header{text-align:center;padding:28px 0 16px;background:var(--bg)}
.header h1{font-size:1.9rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.header p{color:var(--text2);font-size:.88rem;line-height:1.5}
.badge{display:inline-block;background:var(--card2);border:1px solid var(--border);border-radius:20px;padding:4px 14px;font-size:.72rem;color:var(--accent);margin-top:8px}

/* Mode tabs */
.tabs{display:flex;justify-content:center;gap:0;margin:20px auto;max-width:920px;background:var(--card);border:1px solid var(--border);border-radius:30px;padding:4px;overflow-x:auto}
.tab{flex:1;min-width:0;padding:9px 10px;border-radius:26px;border:none;background:transparent;color:var(--text2);font-size:.76rem;font-weight:600;cursor:pointer;transition:all .25s;font-family:inherit;white-space:nowrap}
.tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 4px 15px rgba(56,189,248,.3)}
.tab:hover:not(.active){color:var(--text)}

/* Common */
.step{margin-bottom:24px}.step-title{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.step-num{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.8rem;color:#fff;flex-shrink:0}
.step-label{font-size:1.05rem;font-weight:700}
.group-label{font-size:.72rem;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:block}
.chip-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.chip{padding:6px 13px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.8rem;cursor:pointer;transition:all .2s;user-select:none}
.chip:hover{border-color:var(--accent);color:var(--text)}
.chip.selected{background:linear-gradient(135deg,rgba(56,189,248,.15),rgba(129,140,232,.15));border-color:var(--accent);color:var(--accent);font-weight:600}
.chip.selected::before{content:'✓ '}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:8px;cursor:pointer;transition:all .2s}
.card:hover{border-color:var(--accent);transform:translateY(-1px)}
.card.active{border-color:var(--accent2);background:var(--card2)}
.card-title{font-weight:700;font-size:.9rem;margin-bottom:3px}
.card-desc{font-size:.78rem;color:var(--text2);line-height:1.4}
.card-field{display:inline-block;font-size:.68rem;padding:2px 8px;border-radius:6px;margin-top:4px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:16px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.stat-num{font-size:1.3rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-label{font-size:.65rem;color:var(--text3);margin-top:2px}

.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:8px;overflow:hidden}
.panel-hd{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.panel-hd:hover{background:var(--card2)}
.panel-tl{font-weight:700;font-size:.9rem}
.pbadge{font-size:.65rem;padding:2px 8px;border-radius:10px;font-weight:600}
.pbadge.f{background:rgba(56,189,248,.12);color:var(--accent)}
.pbadge.c{background:rgba(52,211,153,.12);color:var(--green)}
.parrow{color:var(--text3);transition:transform .2s;font-size:.7rem}
.parrow.open{transform:rotate(180deg)}
.panel-bd{padding:0 14px 12px;display:none}
.panel-bd.open{display:block}

.utbl{width:100%;font-size:.75rem;border-collapse:collapse;margin-top:6px}
.utbl th{text-align:left;padding:6px 4px;color:var(--text3);font-weight:600;font-size:.65rem;border-bottom:1px solid var(--border)}
.utbl td{padding:5px 4px;border-bottom:1px solid rgba(30,41,59,.5);color:var(--text2);vertical-align:top}
.utbl tr:hover td{background:rgba(56,189,248,.03)}
.uname{color:var(--text);font-weight:600}
.tag{display:inline-block;font-size:.6rem;padding:1px 5px;border-radius:5px;margin-right:2px}
.tag-iv{background:rgba(251,191,36,.12);color:var(--amber)}
.tag-mn{background:rgba(248,113,113,.12);color:var(--red)}
.tag-no{background:rgba(100,116,139,.08);color:var(--text3)}

.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{padding:5px 11px;border-radius:14px;border:1px solid var(--border);background:var(--card);color:var(--text2);font-size:.75rem;cursor:pointer;transition:all .2s;font-family:inherit}
.fbtn:hover{border-color:var(--accent)}
.fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.strategy{background:var(--card2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.strategy h3{font-size:.95rem;font-weight:700;margin-bottom:8px;color:var(--accent)}
.strategy h4{font-size:.82rem;font-weight:600;color:var(--text);margin:10px 0 5px;display:flex;align-items:center;gap:5px}
.strategy p,.strategy li{font-size:.8rem;color:var(--text2);line-height:1.6}
.strategy ul{padding-left:16px;margin-bottom:6px}
.strategy ul li{margin-bottom:3px}
.rec-subjects{display:flex;flex-wrap:wrap;gap:5px;margin:6px 0}
.rec-chip{padding:4px 10px;border-radius:14px;font-size:.75rem;font-weight:600;background:rgba(56,189,248,.12);color:var(--accent);border:1px solid rgba(56,189,248,.3)}
.rec-chip.core{background:rgba(248,113,113,.1);color:var(--red);border-color:rgba(248,113,113,.3)}
.rec-chip.core::before{content:'★ '}

.search-box{position:relative;margin-bottom:12px}
.search-box input{width:100%;padding:9px 14px 9px 36px;border-radius:18px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.85rem;font-family:inherit;outline:none}
.search-box input:focus{border-color:var(--accent)}
.search-box input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.85rem}

.match-bar{height:4px;background:var(--border);border-radius:2px;margin:5px 0 6px}
.match-fill{height:100%;border-radius:2px}

.empty{text-align:center;padding:40px 16px;color:var(--text3)}
.empty-icon{font-size:2.2rem;margin-bottom:10px}
.empty-text{font-size:.85rem;line-height:1.5}
.footer{text-align:center;padding:20px 0;color:var(--text3);font-size:.7rem;border-top:1px solid var(--border);margin-top:24px}

/* DB Management panel */
.db-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}
.db-panel h3{font-size:1rem;font-weight:700;margin-bottom:12px;color:var(--accent)}
.db-info{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.db-info-item{background:var(--card2);border-radius:8px;padding:10px;text-align:center}
.db-info-item .val{font-size:1.1rem;font-weight:700;color:var(--text)}
.db-info-item .lbl{font-size:.68rem;color:var(--text3)}
.db-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.db-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.db-btn:hover{border-color:var(--accent);color:var(--accent)}
.db-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none}
.db-btn.primary:hover{opacity:.9}
.db-btn.danger{border-color:var(--red);color:var(--red)}

.db-upload-area{border:2px dashed var(--border);border-radius:10px;padding:24px;text-align:center;margin:12px 0;cursor:pointer;transition:all .2s}
.db-upload-area:hover{border-color:var(--accent);background:rgba(56,189,248,.03)}
.db-upload-area.dragover{border-color:var(--accent);background:rgba(56,189,248,.08)}
.db-log{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin-top:10px;max-height:200px;overflow-y:auto;font-size:.72rem;color:var(--text2);font-family:monospace;line-height:1.5}

/* Print styles */
.print-options{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.print-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent);font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.print-btn:hover{background:var(--accent);color:#fff}
.print-btn.pdf{border-color:var(--red);color:var(--red)}
.print-btn.pdf:hover{background:var(--red);color:#fff}

@media print{
  body{background:#fff!important;color:#000!important;font-size:11pt}
  .app{max-width:100%;padding:0}
  .tabs,.filters,.db-panel,.print-options,.mode-toggle,.search-box,.footer,.badge,.no-print{display:none!important}
  .header h1{-webkit-text-fill-color:#1a365d;font-size:16pt}
  .header p{color:#555}
  .card,.panel,.strategy,.stat{background:#fff!important;border:1px solid #ddd!important;color:#000!important;break-inside:avoid}
  .card-title,.panel-tl,.uname{color:#000!important}
  .card-desc,.strategy p,.strategy li{color:#333!important}
  .panel-bd{display:block!important}
  .utbl th{color:#555!important;border-bottom:1px solid #ccc!important}
  .utbl td{color:#333!important;border-bottom:1px solid #eee!important}
  .stat-num{-webkit-text-fill-color:#1a365d}
  .stat-label{color:#666!important}
  .chip.selected{background:#e3f2fd!important;color:#1565c0!important;border-color:#90caf9!important}
  .rec-chip{background:#e3f2fd!important;color:#1565c0!important;border-color:#90caf9!important}
  .rec-chip.core{background:#fce4ec!important;color:#c62828!important;border-color:#ef9a9a!important}
  .tag-iv{background:#fff8e1!important;color:#f57f17!important}
  .tag-mn{background:#fce4ec!important;color:#c62828!important}
  .pbadge{background:#e8eaf6!important;color:#283593!important}
  .step-num{background:#1565c0!important}
  @page{margin:1.5cm;size:A4}
}

@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.header h1{font-size:1.3rem}.db-info{grid-template-columns:1fr}}

/* Mode D/E/F - 고1 맞춤 기능 */
.roadmap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin:10px 0}
.semester-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;transition:all .2s}
.semester-card.current{border-color:var(--accent);box-shadow:0 0 12px rgba(56,189,248,.15)}
.semester-card h4{font-size:.82rem;margin-bottom:8px;color:var(--accent)}
.grade-input{width:60px;padding:5px;border-radius:6px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.85rem;text-align:center;font-family:inherit}
.grade-input:focus{border-color:var(--accent);outline:none}
.grade-bar{height:8px;border-radius:4px;margin-top:6px;background:var(--card2);overflow:hidden}
.grade-bar-fill{height:100%;border-radius:4px;transition:width .3s}
.sim-result{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin:8px 0}
.sim-tag{display:inline-block;padding:3px 10px;border-radius:12px;font-size:.72rem;margin:2px}
.profile-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin:8px 0}
.profile-input{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.85rem;font-family:inherit;margin-bottom:8px}
.profile-input:focus{border-color:var(--accent);outline:none}
.profile-textarea{width:100%;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-size:.82rem;font-family:inherit;resize:vertical;min-height:60px}
.profile-textarea:focus{border-color:var(--accent);outline:none}
.student-list-item{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .15s}
.student-list-item:hover{background:var(--card2)}
.student-list-item.active{background:rgba(56,189,248,.08);border-left:3px solid var(--accent)}
.profile-badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:.68rem;font-weight:600}
.action-btn{padding:8px 16px;border-radius:8px;border:none;font-size:.82rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.action-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.action-btn.primary:hover{opacity:.9;transform:translateY(-1px)}
.action-btn.secondary{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.action-btn.danger{background:rgba(248,113,113,.15);color:var(--red);border:1px solid rgba(248,113,113,.3)}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .icon{font-size:2.5rem;margin-bottom:12px}
.two-col{display:grid;grid-template-columns:280px 1fr;gap:16px}
@media(max-width:768px){
.two-col{grid-template-columns:1fr}
.roadmap-grid{grid-template-columns:repeat(3,1fr)}
.tabs{flex-wrap:nowrap;overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;scrollbar-width:none;background:var(--card2);border:1px solid var(--accent);box-shadow:0 0 12px rgba(56,189,248,.1);position:relative}
.tabs::-webkit-scrollbar{display:none}
.tabs::after{content:'';position:sticky;right:0;top:0;bottom:0;width:30px;background:linear-gradient(90deg,transparent,var(--card2));pointer-events:none;flex-shrink:0}
.tab{font-size:.68rem;padding:8px 8px;min-width:max-content}
}
</style>
</head>

function getUnivs(){
  const mj=selMaj?MAJORS.find(x=>x.id===selMaj):null;
  const mjKw=mj?mj.keywords:[];
  return UNIV_DB.filter(u=>regF==='전체'||u.rg===regF).map(u=>{
    let mp=u.pg.filter(p=>!SKIP.some(k=>p.n.includes(k)));
    if(!mp.length) return null;
    // 모드B에서 학과 선택 시: 해당 학과 키워드로 관련 전형만 필터링
    if(mode==='B'&&mj){
      const mjGk=mj.gradeKeys||[];
      // 1) dept 학과명에 keyword 포함 전형
      const hasDept=mp.filter(p=>p.dept&&p.dept.some(d=>mjKw.some(k=>d.d.toLowerCase().includes(k.toLowerCase()))));
      // 2) grades key에 gradeKeys 포함 전형 (dept 없는 대학용)
      const hasGrade=mjGk.length>0?mp.filter(p=>p.grades&&mjGk.some(gk=>Object.keys(p.grades).some(k=>k.includes(gk)))):[];
      const related=[...new Set([...hasDept,...hasGrade])];
      if(related.length>0){
        mp=related;
      } else {
        // dept도 grades도 매칭 없음 → 이 대학엔 해당 학과 없음
        return null;
      }
    }
    return {...u,mp,tq:mp.reduce((s,p)=>s+p.q,0)};
  }).filter(Boolean).sort((a,b)=>{
    if(myGrade>0){
      // 합격 가능성 점수 계산: 내 등급과 합격자 평균등급 차이
      const scoreA=a.mp.reduce((best,p)=>{
        if(!p.grades) return best;
        const g=p.grades['인문']||p.grades['자연'];
        if(!g) return best;
        const diff=g.avg-myGrade; // 양수면 합격 가능성 높음
        return Math.max(best,diff);
      },-999);
      const scoreB=b.mp.reduce((best,p)=>{
        if(!p.grades) return best;
        const g=p.grades['인문']||p.grades['자연'];
        if(!g) return best;
        const diff=g.avg-myGrade;
        return Math.max(best,diff);
      },-999);
      // 내 등급보다 합격자 평균이 높은(=쉬운) 대학 먼저
      if(scoreA!==scoreB) return scoreB-scoreA;
    }
    return b.tq-a.tq;
  });
}

function renderD(){
  function gradeColor(g){
    if(!g||g===0)return 'var(--text3)';
    if(g<=2)return 'var(--green)';if(g<=3)return 'var(--accent)';if(g<=4)return 'var(--amber)';if(g<=5)return 'var(--accent3)';return 'var(--red)';
  }
  function gradeWidth(g){return g?Math.max(5,(9-g)/8*100):0}
  function getSubjects(sem){
    if(sem==='1-1'||sem==='1-2') return COMMON_SUBJ_1[sem]||[];
    return userSubjects[sem]||[];
  }
  // 학기별 평균 계산
  const semAvgs=SEMESTERS.map(s=>{
    const subjs=getSubjects(s);
    const vals=subjs.map(subj=>{const v=roadmapData[s+'_'+subj];return v?parseFloat(v):0}).filter(v=>v>0);
    return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:0;
  });
  const totalVals=Object.values(roadmapData).filter(v=>v&&parseFloat(v)>0).map(v=>parseFloat(v));
  const totalAvg=totalVals.length?(totalVals.reduce((a,b)=>a+b)/totalVals.length):0;

  // 학년 구분
  const semGroups=[
    {label:'1학년 (공통과목)',sems:['1-1','1-2'],note:'공통과목은 자동 설정됩니다'},
    {label:'2학년 (선택과목)',sems:['2-1','2-2'],note:'이수하는 과목을 직접 추가하세요'},
    {label:'3학년 (선택과목)',sems:['3-1'],note:'이수하는 과목을 직접 추가하세요'}
  ];

  let tablesHtml='';
  semGroups.forEach(sg=>{
    tablesHtml+=`<div style="margin-bottom:20px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <span style="font-size:.9rem;font-weight:700;color:var(--accent)">${sg.label}</span>
        <span style="font-size:.68rem;color:var(--text3)">${sg.note}</span>
      </div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse;font-size:.8rem">
        <thead><tr style="border-bottom:2px solid var(--border)">
          <th style="padding:8px;text-align:left;color:var(--accent);min-width:100px">과목</th>
          ${sg.sems.map(s=>'<th style="padding:8px;text-align:center;min-width:90px;color:var(--text2)">'+s+'</th>').join('')}
        </tr></thead><tbody>`;

    // 1학년: 학기별 공통과목 (1-1과 1-2 과목명이 다름)
    if(sg.sems[0]==='1-1'){
      const subj1=COMMON_SUBJ_1['1-1'];
      const subj2=COMMON_SUBJ_1['1-2'];
      const maxLen=Math.max(subj1.length,subj2.length);
      for(let ri=0;ri<maxLen;ri++){
        const s1=subj1[ri]||'';
        const s2=subj2[ri]||'';
        // 행 라벨: 공통 카테고리명 추출 (공통국어1→국어 계열)
        const label=s1.replace(/[12]$/,'').replace('공통','').replace('통합','').replace('과학탐구실험','과탐')||s2.replace(/[12]$/,'').replace('공통','').replace('통합','').replace('과학탐구실험','과탐');
        tablesHtml+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px;font-weight:600;font-size:.75rem;color:var(--text3)">'+label+'</td>';
        // 1-1 열
        if(s1){
          const key='1-1_'+s1;
          const v=roadmapData[key]||'';
          tablesHtml+='<td style="padding:4px;text-align:center"><div style="font-size:.65rem;color:var(--text3);margin-bottom:2px">'+s1+'</div><input class="grade-input" type="number" min="1" max="9" step="0.1" placeholder="—" value="'+v+'" onchange="setRoadmap(&#39;'+key+'&#39;,this.value)"><div class="grade-bar"><div class="grade-bar-fill" style="width:'+gradeWidth(parseFloat(v))+'%;background:'+gradeColor(parseFloat(v))+'"></div></div></td>';
        } else { tablesHtml+='<td></td>'; }
        // 1-2 열
        if(s2){
          const key='1-2_'+s2;
          const v=roadmapData[key]||'';
          tablesHtml+='<td style="padding:4px;text-align:center"><div style="font-size:.65rem;color:var(--text3);margin-bottom:2px">'+s2+'</div><input class="grade-input" type="number" min="1" max="9" step="0.1" placeholder="—" value="'+v+'" onchange="setRoadmap(&#39;'+key+'&#39;,this.value)"><div class="grade-bar"><div class="grade-bar-fill" style="width:'+gradeWidth(parseFloat(v))+'%;background:'+gradeColor(parseFloat(v))+'"></div></div></td>';
        } else { tablesHtml+='<td></td>'; }
        tablesHtml+='</tr>';
      }
    } else {
      // 2~3학년: 사용자 추가 과목
      sg.sems.forEach(sem=>{
        const subjs=userSubjects[sem]||[];
        if(subjs.length===0&&sg.sems.length>1) return; // 빈 학기 스킵 방지 안 함
      });
      // 모든 학기의 과목을 합쳐서 표시 (학기별로 다를 수 있음)
      const allSubjs=new Set();
      sg.sems.forEach(sem=>(userSubjects[sem]||[]).forEach(s=>allSubjs.add(s)));
      
      if(allSubjs.size>0){
        [...allSubjs].forEach(subj=>{
          tablesHtml+='<tr style="border-bottom:1px solid var(--border)"><td style="padding:8px;font-weight:600;display:flex;align-items:center;gap:4px">'+subj+'<button style="background:none;border:none;color:var(--red);cursor:pointer;font-size:.7rem;padding:2px" onclick="removeUserSubject(&#39;'+subj+'&#39;,&#39;'+sg.sems.join(',')+'&#39;)">✕</button></td>';
          sg.sems.forEach(s=>{
            const hasSubj=(userSubjects[s]||[]).includes(subj);
            if(hasSubj){
              const key=s+'_'+subj;
              const v=roadmapData[key]||'';
              tablesHtml+='<td style="padding:4px;text-align:center"><input class="grade-input" type="number" min="1" max="9" step="0.1" placeholder="—" value="'+v+'" onchange="setRoadmap(&#39;'+key+'&#39;,this.value)"><div class="grade-bar"><div class="grade-bar-fill" style="width:'+gradeWidth(parseFloat(v))+'%;background:'+gradeColor(parseFloat(v))+'"></div></div></td>';
            } else {
              tablesHtml+='<td style="padding:4px;text-align:center;color:var(--text3);font-size:.7rem">미이수</td>';
            }
          });
          tablesHtml+='</tr>';
        });
      }

      // 과목 추가 UI
      tablesHtml+='<tr><td colspan="'+(sg.sems.length+1)+'" style="padding:8px"><div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">';
      sg.sems.forEach(sem=>{
        tablesHtml+='<div style="display:flex;gap:4px;align-items:center"><span style="font-size:.7rem;color:var(--text3);min-width:28px">'+sem+':</span><input class="grade-input" id="addSubj_'+sem+'" placeholder="과목명 입력" style="width:100px;text-align:left;font-size:.72rem"><button class="action-btn primary" style="padding:4px 8px;font-size:.68rem" onclick="addUserSubject(&#39;'+sem+'&#39;)">+</button></div>';
      });
      tablesHtml+='</div></td></tr>';
    }

    // 평균 행
    tablesHtml+='</tbody><tfoot><tr style="border-top:2px solid var(--border)"><td style="padding:8px;font-weight:700;color:var(--accent)">평균</td>';
    sg.sems.forEach(s=>{
      const idx=SEMESTERS.indexOf(s);
      const a=semAvgs[idx];
      tablesHtml+='<td style="padding:8px;text-align:center;font-weight:700;font-size:.95rem;color:'+gradeColor(a)+'">'+(a?a.toFixed(2):'—')+'</td>';
    });
    tablesHtml+='</tr></tfoot></table></div></div>';
  });

  return `
    <div class="step"><div class="step-title"><div class="step-num">1</div><span class="step-label">학기별 목표 등급 설정</span></div>
    <p style="font-size:.78rem;color:var(--text2);margin-bottom:12px">1학년은 공통과목이 자동 설정됩니다. 2~3학년은 본인이 선택한 과목을 직접 추가하세요.</p>
    ${tablesHtml}</div>

    <div class="step"><div class="step-title"><div class="step-num">2</div><span class="step-label">등급 추이 시각화</span></div>
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px">
      <div style="display:flex;align-items:end;justify-content:space-around;height:180px;gap:8px;padding-bottom:24px;position:relative;border-bottom:1px solid var(--border)">
        ${semAvgs.map((a,i)=>{
          const h=a?(9-a)/8*150:0;
          return '<div style="display:flex;flex-direction:column;align-items:center;flex:1"><div style="font-size:.7rem;font-weight:700;color:'+gradeColor(a)+';margin-bottom:4px">'+(a?a.toFixed(1):'—')+'</div><div style="width:36px;height:'+h+'px;border-radius:6px 6px 0 0;background:linear-gradient(180deg,'+gradeColor(a)+',rgba(56,189,248,.2));transition:height .5s"></div><div style="font-size:.68rem;color:var(--text3);margin-top:6px">'+SEMESTERS[i]+'</div></div>';
        }).join('')}
      </div>
      <div style="text-align:center;margin-top:12px">
        <span style="font-size:.82rem;color:var(--text2)">전체 평균 </span>
        <span style="font-size:1.3rem;font-weight:800;color:${gradeColor(totalAvg)}">${totalAvg?totalAvg.toFixed(2):'미입력'}</span>
      </div>
    </div></div>

    <div class="step"><div class="step-title"><div class="step-num">3</div><span class="step-label">데이터 관리</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="action-btn secondary" onclick="exportRoadmap()">📥 JSON 내보내기</button>
      <button class="action-btn secondary" onclick="document.getElementById('roadmapFileInput').click()">📤 JSON 불러오기</button>
      <input type="file" id="roadmapFileInput" accept=".json" style="display:none" onchange="importRoadmap(event)">
      <button class="action-btn danger" onclick="if(confirm('로드맵 데이터를 초기화할까요?')){roadmapData={};userSubjects={'2-1':[],'2-2':[],'3-1':[]};localStorage.removeItem('roadmap');localStorage.removeItem('userSubjects');render()}">🗑️ 초기화</button>
    </div></div>`;
}


// ========== 모드 E: 선택과목 시뮬레이터 ==========
function renderE(){
  // 선택된 과목으로 지원 가능한 학과·대학 미리보기
  const simMatched=simSub.size?MAJORS.map(m=>{const mc=m.rec.filter(s=>simSub.has(s)).length;return{...m,mc,mr:mc/m.rec.length}}).filter(m=>m.mc>0).sort((a,b)=>b.mr-a.mr||b.mc-a.mc):[];

  // 공식 권장과목 매칭
  const officialMatches=[];
  if(simSub.size){
    Object.entries(OFFICIAL_REC).forEach(([field,info])=>{
      const coreMatch=info.core.filter(s=>simSub.has(s));
      const recMatch=info.rec.filter(s=>simSub.has(s));
      if(coreMatch.length>0||recMatch.length>0){
        officialMatches.push({field,coreMatch,recMatch,coreMiss:info.core.filter(s=>!simSub.has(s)),total:coreMatch.length*2+recMatch.length,depts:info.depts});
      }
    });
    officialMatches.sort((a,b)=>b.total-a.total);
  }

  // 매칭 학과 기반 대학 검색
  const simUnivs=[];
  if(simMatched.length){
    const matchedIds=new Set(simMatched.map(m=>m.id));
    const matchedKW=new Set();
    simMatched.forEach(m=>m.keywords.forEach(k=>matchedKW.add(k)));
    UNIV_DB.forEach(u=>{
      const validPg=u.pg.filter(p=>!SKIP.some(sk=>p.n.includes(sk)));
      const matched=validPg.filter(p=>{
        if(p.dept)return p.dept.some(d=>matchedKW.has(d.d)||simMatched.some(m=>m.keywords.some(k=>d.d.includes(k))));
        return matchedKW.has(u.nm)||simMatched.some(m=>m.keywords.some(k=>u.nm.includes(k)));
      });
      if(matched.length)simUnivs.push({...u,matchedPg:matched,score:matched.length});
    });
    simUnivs.sort((a,b)=>b.score-a.score);
  }

  return `
    <div class="step"><div class="step-title"><div class="step-num">1</div><span class="step-label">2학년 선택과목 조합을 시뮬레이션하세요</span></div>
    <p style="font-size:.78rem;color:var(--text2);margin-bottom:12px">이수하려는 과목을 선택하면, 지원 가능한 학과·대학과 공식 권장과목 매칭 결과를 미리 볼 수 있습니다.</p>
    ${SUBJECT_GROUPS.map(g=>'<span class="group-label">'+g.label+'</span><div class="chip-grid">'+g.subjects.map(s=>'<span class="chip '+(simSub.has(s)?'selected':'')+'" onclick="toggleSim(&#39;'+s+'&#39;)">'+s+'</span>').join('')+'</div>').join('')}
    <div style="margin-top:8px;font-size:.75rem;color:var(--text3)">선택: ${simSub.size}개 과목${simSub.size?' — '+[...simSub].join(', '):''}</div>
    ${simSub.size?'<button class="action-btn secondary" style="margin-top:6px;font-size:.72rem" onclick="simSub.clear();render()">초기화</button>':''}
    </div>

    ${officialMatches.length?`
    <div class="step"><div class="step-title"><div class="step-num">2</div><span class="step-label">공식 권장과목 매칭 (5개 대학 공동연구)</span></div>
    ${officialMatches.map(o=>`
      <div class="sim-result">
        <div style="font-weight:700;font-size:.9rem;margin-bottom:6px">${o.field} 분야</div>
        <div style="font-size:.78rem;color:var(--text2);margin-bottom:4px">관련 학과: ${o.depts.slice(0,4).join(', ')}${o.depts.length>4?' 외 '+(o.depts.length-4)+'개':''}</div>
        <div style="margin:6px 0">
          ${o.coreMatch.map(s=>'<span class="sim-tag" style="background:rgba(52,211,153,.15);color:var(--green)">✓ 핵심 '+s+'</span>').join('')}
          ${o.coreMiss.map(s=>'<span class="sim-tag" style="background:rgba(248,113,113,.1);color:var(--red)">✗ 핵심 미이수 '+s+'</span>').join('')}
          ${o.recMatch.map(s=>'<span class="sim-tag" style="background:rgba(56,189,248,.12);color:var(--accent)">✓ 권장 '+s+'</span>').join('')}
        </div>
        <div style="height:6px;border-radius:3px;background:var(--card2);margin-top:8px"><div style="height:100%;border-radius:3px;width:${Math.round((o.coreMatch.length/(o.coreMatch.length+o.coreMiss.length))*100)}%;background:${o.coreMiss.length===0?'var(--green)':'var(--amber)'}"></div></div>
        <div style="font-size:.68rem;color:var(--text3);margin-top:4px">핵심과목 이수율: ${o.coreMatch.length}/${o.coreMatch.length+o.coreMiss.length} ${o.coreMiss.length===0?'✅ 완벽':'⚠️ 미이수 과목 있음'}</div>
      </div>
    `).join('')}
    </div>`:''}

    ${simMatched.length?`
    <div class="step"><div class="step-title"><div class="step-num">${officialMatches.length?'3':'2'}</div><span class="step-label">매칭 학과 (${simMatched.length}개)</span></div>
    <div class="chip-grid">${simMatched.slice(0,20).map(m=>'<span class="chip selected" style="cursor:default">'+m.name+' <span style="color:var(--accent);font-size:.7rem">'+Math.round(m.mr*100)+'%</span></span>').join('')}${simMatched.length>20?'<span class="chip" style="cursor:default;color:var(--text3)">외 '+(simMatched.length-20)+'개</span>':''}</div>
    </div>
    <div class="step"><div class="step-title"><div class="step-num">${officialMatches.length?'4':'3'}</div><span class="step-label">지원 가능 대학 (${simUnivs.length}개)</span></div>
    ${simUnivs.slice(0,15).map(u=>'<div class="card"><div class="card-title">'+u.nm+' <span style="font-size:.7rem;color:var(--text3)">'+u.rg+'·'+u.tp+'</span></div><div style="font-size:.75rem;color:var(--text2)">'+u.matchedPg.map(p=>p.n).join(', ')+'</div></div>').join('')}
    ${simUnivs.length>15?'<div style="text-align:center;color:var(--text3);font-size:.78rem;padding:10px">외 '+(simUnivs.length-15)+'개 대학</div>':''}
    </div>`:`
    ${simSub.size?'<div class="empty-state"><div class="icon">🔍</div><p>선택한 과목 조합으로 매칭되는 학과가 없습니다.<br>과목을 추가해보세요.</p></div>':'<div class="empty-state"><div class="icon">🧪</div><p>위에서 과목을 선택하면<br>지원 가능한 학과와 대학이 표시됩니다</p></div>'}
    `}`;
}

// ========== 모드 F: 학생 프로필 (개인 로그인 + 이력) ==========

          </div>

          <div><span style="font-weight:700">${p.name||'이름 미설정'}</span> <span style="font-size:.72rem;color:var(--text3)">${profileUser}</span></div>

        <button class="action-btn secondary" onclick="profileLogout()" style="font-size:.7rem;padding:5px 10px">🔓 로그아웃</button>
        <button class="action-btn" onclick="saveConsultRecord()" style="font-size:.7rem;padding:5px 10px;background:rgba(52,211,153,.15);color:var(--green);border:1px solid rgba(52,211,153,.3)">📋 상담 기록 저장</button>

    return headerHtml+`
      <div class="profile-card">
        <div style="font-weight:700;margin-bottom:12px">기본 정보 수정</div>
        <input class="profile-input" id="ed_name" placeholder="이름" value="${p.name||''}">
        <input class="profile-input" id="ed_grade" type="number" min="1" max="9" step="0.1" placeholder="현재 평균등급" value="${p.grade||''}">
        <input class="profile-input" id="ed_major" placeholder="희망학과 (예: 컴퓨터공학)" value="${p.major||''}">
        <input class="profile-input" id="ed_target" placeholder="목표대학 (예: 서울대)" value="${p.target||''}">
        <textarea class="profile-textarea" id="ed_activities" placeholder="주요 활동이력 (수상, 동아리, 봉사 등)">${p.activities||''}</textarea>
        <textarea class="profile-textarea" id="ed_memo" placeholder="나만의 메모" style="margin-top:8px">${p.memo||''}</textarea>
        <div style="display:flex;gap:8px;margin-top:14px">
          <button class="action-btn primary" onclick="doSaveProfile()">저장</button>
          <button class="action-btn secondary" onclick="profileMode='view';render()">취소</button>
        </div>
        <div style="font-size:.68rem;color:var(--text3);margin-top:10px">💡 등급이나 희망학과를 변경하면 자동으로 이력에 기록됩니다</div>
      </div>`+footerHtml;
  }

  // === 성적 추이 모드 ===
  if(profileMode==='grades'){
    const gh=p.gradeHistory||[];
    // 성적 기록 입력 폼 + 기존 이력 + 그래프
    function gradeColor(g){if(!g)return 'var(--text3)';if(g<=2)return 'var(--green)';if(g<=3)return 'var(--accent)';if(g<=4)return 'var(--amber)';if(g<=5)return 'var(--accent3)';return 'var(--red)'}
    const chartHtml=gh.length>=2?`
      <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px">
        <div style="font-size:.78rem;font-weight:600;margin-bottom:10px;color:var(--accent)">📈 등급 변화 그래프</div>
        <div style="display:flex;align-items:end;justify-content:space-around;height:140px;gap:6px;padding-bottom:20px;border-bottom:1px solid var(--border)">
          ${gh.map(h=>{const ht=h.grade?(9-h.grade)/8*120:0;return '<div style="display:flex;flex-direction:column;align-items:center;flex:1"><div style="font-size:.65rem;font-weight:700;color:'+gradeColor(h.grade)+';margin-bottom:3px">'+h.grade+'</div><div style="width:28px;height:'+ht+'px;border-radius:5px 5px 0 0;background:linear-gradient(180deg,'+gradeColor(h.grade)+',rgba(56,189,248,.15))"></div><div style="font-size:.55rem;color:var(--text3);margin-top:4px;white-space:nowrap">'+h.date.slice(5)+'</div></div>'}).join('')}
        </div>
        ${gh.length>=2?'<div style="text-align:center;margin-top:8px;font-size:.75rem">변화: <span style="font-weight:700;color:'+(gh[gh.length-1].grade<=gh[0].grade?'var(--green)':'var(--red)')+'">'+gh[0].grade+' → '+gh[gh.length-1].grade+' ('+(gh[gh.length-1].grade<gh[0].grade?'▲':'▼')+Math.abs(gh[gh.length-1].grade-gh[0].grade).toFixed(1)+')</span></div>':''}
      </div>`:'';

    return headerHtml+`
      <div class="profile-card">
        <div style="font-weight:700;margin-bottom:10px">📊 성적 기록 추가</div>
        <div style="display:flex;gap:8px;align-items:end">
          <div style="flex:1">
            <div style="font-size:.7rem;color:var(--text3);margin-bottom:4px">시험 구분</div>
            <select class="profile-input" id="gr_exam" style="margin-bottom:0">
              <option value="1학기 중간">1학기 중간</option><option value="1학기 기말">1학기 기말</option>
              <option value="2학기 중간">2학기 중간</option><option value="2학기 기말">2학기 기말</option>
              <option value="모의고사">모의고사</option><option value="기타">기타</option>
            </select>
          </div>
          <div style="width:90px">
            <div style="font-size:.7rem;color:var(--text3);margin-bottom:4px">평균등급</div>
            <input class="profile-input" id="gr_grade" type="number" min="1" max="9" step="0.1" placeholder="등급" style="margin-bottom:0">
          </div>
          <button class="action-btn primary" onclick="addGradeRecord()" style="padding:8px 14px;white-space:nowrap">+ 기록</button>
        </div>
      </div>
      ${chartHtml}
      ${gh.length?`
      <div class="profile-card">
        <div style="font-weight:700;margin-bottom:10px">📋 전체 기록 (${gh.length}건)</div>
        ${[...gh].reverse().map((h,i)=>'<div style="display:flex;align-items:center;gap:10px;padding:8px 0;'+(i<gh.length-1?'border-bottom:1px solid var(--border)':'')+'"><div style="font-size:.72rem;color:var(--text3);min-width:70px">'+h.date+'</div><div style="flex:1;font-size:.8rem">'+(h.exam||'')+'</div><div style="font-weight:700;font-size:.9rem;color:'+gradeColor(h.grade)+'">'+h.grade+'등급</div><div style="font-size:.65rem;color:var(--text3)">'+(h.prev!=='없음'?'← '+h.prev:'첫 기록')+'</div><button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:.7rem" onclick="deleteGradeRecord('+(gh.length-1-i)+')">✕</button></div>').join('')}
      </div>`:
      '<div class="empty-state"><div class="icon">📊</div><p>아직 성적 기록이 없습니다<br>위에서 시험 결과를 입력해보세요</p></div>'}
    `+footerHtml;
  }

  // === 상담일지 모드 ===
  if(profileMode==='journal'){
    const jl=p.journal||[];
    return headerHtml+`
      <div class="profile-card">
        <div style="font-weight:700;margin-bottom:10px">📝 새 일지 작성</div>
        <div style="display:flex;gap:8px;margin-bottom:8px">
          <div style="flex:1">
            <div style="font-size:.7rem;color:var(--text3);margin-bottom:4px">분류</div>
            <select class="profile-input" id="jn_type" style="margin-bottom:0">
              <option value="📌 진로상담">📌 진로상담</option><option value="📊 성적분석">📊 성적분석</option>
              <option value="🎯 목표설정">🎯 목표설정</option><option value="💭 고민/질문">💭 고민/질문</option>
              <option value="✅ 활동기록">✅ 활동기록</option><option value="📝 기타">📝 기타</option>
            </select>
          </div>
        </div>
        <textarea class="profile-textarea" id="jn_content" placeholder="오늘의 상담 내용, 느낀 점, 다음 목표 등을 자유롭게 적어보세요..." style="min-height:80px"></textarea>
        <button class="action-btn primary" onclick="addJournal()" style="margin-top:8px">저장</button>
      </div>
      ${jl.length?`
      <div style="font-weight:700;font-size:.85rem;margin:16px 0 10px">📅 일지 타임라인 (${jl.length}건)</div>
      ${[...jl].reverse().map((j,i)=>`
        <div class="profile-card" style="margin-bottom:8px;position:relative">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <div><span style="font-size:.72rem;padding:2px 8px;border-radius:8px;background:rgba(56,189,248,.1);color:var(--accent)">${j.type}</span> <span style="font-size:.68rem;color:var(--text3);margin-left:4px">${j.date}</span></div>
            <button style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:.72rem" onclick="deleteJournal(${jl.length-1-i})">삭제</button>
          </div>
          <p style="font-size:.82rem;color:var(--text2);line-height:1.65;white-space:pre-wrap">${j.content}</p>
        </div>
      `).join('')}`:
      '<div class="empty-state"><div class="icon">📝</div><p>아직 일지가 없습니다<br>상담 내용이나 느낀 점을 기록해보세요</p></div>'}
    `+footerHtml;
  }

  // === 내 정보 보기 (기본) ===
  let recHtml='';
  if(p.major){
    const mj=MAJORS.find(m=>m.name===p.major||m.keywords.some(k=>p.major.includes(k)));
    if(mj){
      recHtml='<div style="margin-top:16px"><span class="group-label">🎯 희망학과 기반 권장 선택과목</span><div class="chip-grid" style="margin-top:6px">'+mj.rec.map(s=>'<span class="chip selected" style="cursor:default">'+s+'</span>').join('')+'</div><div style="margin-top:8px;font-size:.78rem;color:var(--text2);background:var(--card2);border-radius:8px;padding:12px;line-height:1.6">💡 <b>'+mj.name+'</b> 전략: '+mj.strategy+'</div></div>';
    }
  }

  // 희망학과 변경 타임라인 (최근 3개)
  const mh=p.majorHistory||[];
  const majorTimelineHtml=mh.length?'<div style="margin-top:14px"><span class="group-label">🔄 희망학과 변경 이력</span>'+mh.slice(-3).reverse().map(h=>'<div style="font-size:.75rem;color:var(--text2);padding:4px 0"><span style="color:var(--text3)">'+h.date+'</span> '+h.prev+' → <span style="font-weight:600;color:var(--accent)">'+h.major+'</span></div>').join('')+'</div>':'';

  // 최근 성적 미니 요약
  const recentGrades=(p.gradeHistory||[]).slice(-3);
  const gradeMinHtml=recentGrades.length?'<div style="margin-top:14px"><span class="group-label">📊 최근 성적</span><div style="display:flex;gap:6px;margin-top:4px">'+recentGrades.map(h=>{const gc=h.grade<=2?'var(--green)':h.grade<=3?'var(--accent)':h.grade<=4?'var(--amber)':'var(--red)';return '<div style="background:var(--card2);border-radius:8px;padding:8px 12px;text-align:center"><div style="font-size:1rem;font-weight:700;color:'+gc+'">'+h.grade+'</div><div style="font-size:.6rem;color:var(--text3)">'+h.date.slice(5)+'</div></div>'}).join('')+'</div></div>':'';

  return headerHtml+`
    <div class="profile-card">
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px">
        <div class="stat"><div class="stat-num">${p.grade||'—'}</div><div class="stat-label">현재 평균등급</div></div>
        <div class="stat"><div class="stat-num">${p.major||'—'}</div><div class="stat-label">희망학과</div></div>
        <div class="stat"><div class="stat-num">${p.target||'—'}</div><div class="stat-label">목표대학</div></div>
      </div>
      ${p.activities?'<div style="background:var(--card2);border-radius:8px;padding:12px;margin-top:8px"><span class="group-label">📋 주요 활동이력</span><p style="font-size:.82rem;color:var(--text2);line-height:1.6;white-space:pre-wrap;margin-top:6px">'+p.activities+'</p></div>':''}
      ${gradeMinHtml}
      ${majorTimelineHtml}
      ${recHtml}
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="action-btn secondary" style="font-size:.72rem" onclick="doExportMyProfile()">📥 내 데이터 내보내기</button>
      <button class="action-btn danger" style="font-size:.72rem" onclick="if(confirm('정말 프로필을 삭제할까요?\n모든 성적 기록과 일지가 사라집니다.')){localStorage.removeItem('profile_'+profileUser);profileLogout()}">🗑️ 프로필 삭제</button>
    </div>
  `+footerHtml;
}

// ── 의도 분류기 ──────────────────────────────
function detectIntent(q) {
  const t = q.replace(/\s/g,'');
  if(/내신|등급|성적/.test(t) && /몇|얼마|기준|cut|컷/.test(t)) return 'grade_query';
  // 대학 추천: '대학'+'가능/추천' 또는 내신등급+학과명 조합 → 최우선
  if(/어디|대학|학교/.test(t) && /갈수있|지원가능|가능|추천|안정|적정|도전/.test(t)) return 'univ_recommend';
  if(/내신|등급/.test(t) && /대학|학교/.test(t)) return 'univ_recommend';
  if(/경쟁률|높은|낮은/.test(t)) return 'cr_query';
  if(/수능최저|최저|없는|있는/.test(t)) return 'suneung_query';
  if(/면접|서류|전형방법|어떻게/.test(t)) return 'method_query';
  if(/전형|모집|정보|알려줘|뭐야|어때/.test(t) && /대학|학교/.test(t)) return 'univ_info';
  if(/뭐야|무슨|어떤|설명|차이|다른점/.test(t)) return 'explain';
  // 학과 추천: '학과'+'추천/뭐가좋/유망' 명시적으로 요청한 경우만
  if(/뭐가좋|추천해|유망|취업잘|어떤학과|무슨학과/.test(t)) return 'major_recommend';
  if(/이과|문과|예체능/.test(t) && /학과|전공/.test(t)) return 'major_recommend';
  if(/비교|vs/.test(t)) return 'compare';
  if(/거기|그대학|그곳|방금|아까/.test(t)) return 'refer_prev';
  return 'general';
}

// ── 엔티티 추출기 ──────────────────────────────
function extractEntities(q) {
  const ent = {univs:[], majors:[], regions:[], grade:null};
  const SKIP_KW = ['기회균형','농어촌','특수','재직','특성화','기초생활','장애인','국가보훈'];

  // 내신 등급 추출
  const gradeM = q.match(/(\d+\.?\d*)\s*(?:등급|점)/);
  if(gradeM) ent.grade = parseFloat(gradeM[1]);

  // 지역 추출
  const regions = ['서울','경인','경기','인천','강원','충청','충북','충남','호남','전북','전남','광주','대경','대구','경북','동남','부산','경남','울산','제주'];
  regions.forEach(r => { if(q.includes(r)) ent.regions.push(r); });

  // 대학명 추출
  UNIV_DB.forEach(u => { if(q.includes(u.nm.replace('학교','').replace('대학교',''))) ent.univs.push(u.nm); });

  // 학과 키워드 추출
  const majorKws = ['의예','치의예','한의예','수의예','약학','간호','컴퓨터','소프트웨어','인공지능','전자','전기','기계','화학공학','생명공학','건축','토목','경영','경제','금융','법학','행정','경찰','경찰행정','소방','군사','사회복지','사회학','심리','교육','사범','유아','아동','언어','국어','영어','문학','미디어','언론','디자인','미술','체육','스포츠','물리치료','방사선','임상병리','작업치료','치위생','보건','식품','영양','관광','호텔','항공','국제','무역','도시','환경','수학','통계','물리','화학','생명','생물','해양','수산','농업','산림'];
  majorKws.forEach(k => { if(q.includes(k)) ent.majors.push(k); });
  // "OO학과/학부/전공" 패턴으로 직접 추출 (목록에 없는 학과도 처리)
  const deptPatterns = q.match(/([가-힣]{2,8}(?:학과|학부|전공))/g);
  if(deptPatterns) {
    deptPatterns.forEach(d => {
      const key = d.replace(/학과$|학부$|전공$/, '');
      if(key.length >= 2 && !ent.majors.includes(key)) ent.majors.push(key);
    });
  }

  return ent;
}

function toRgCode(regionText) {
  const map = {'서울':'서울','경기':'경인','인천':'경인','경인':'경인','강원':'강원','충청':'충청','충북':'충청','충남':'충청','대전':'충청','세종':'충청','전북':'호남','전남':'호남','광주':'호남','호남':'호남','대구':'대경','경북':'대경','대경':'대경','부산':'동남','경남':'동남','울산':'동남','동남':'동남','제주':'제주'};
  for(const [k,v] of Object.entries(map)) { if(regionText.includes(k)) return v; }
  return null;
}

// ── 핵심 쿼리 엔진 ──────────────────────────────
function queryUnivs({majors=[], regions=[], maxGrade=null, noSuneung=false, hasInterview=null, limit=8}={}) {
  const SKIP_KW = ['기회균형','농어촌','특수','재직','특성화','기초생활','장애인','국가보훈','고른기회','사회통합','보훈','조기취업','장애'];
  let results = [];

  UNIV_DB.forEach(u => {
    const rgCode = toRgCode(regions.join(' ')) || (regions.length ? null : 'ALL');
    if(rgCode !== 'ALL' && rgCode && u.rg !== rgCode) return;

    u.pg.filter(p => !SKIP_KW.some(k => p.n.includes(k))).forEach(pg => {
      // 학과 매칭
      let majorMatch = majors.length === 0;
      let matchedDept = null;
      if(majors.length > 0) {
        const deptMatch = (pg.dept||[]).find(d => majors.some(m => d.d.includes(m)));
        const gradeMatch = pg.grades && majors.some(m => Object.keys(pg.grades).some(k => k.includes(m)));
        if(deptMatch) { majorMatch = true; matchedDept = deptMatch; }
        else if(gradeMatch) majorMatch = true;
      }
      if(!majorMatch) return;

      // 내신 필터
      if(maxGrade && pg.grades) {
        const gradeVals = Object.values(pg.grades).map(g=>g.avg).filter(Boolean);
        if(gradeVals.length > 0 && Math.min(...gradeVals) > maxGrade + 0.5) return;
      }

      // 수능최저 필터
      if(noSuneung && pg.mn && pg.mn !== '미적용' && pg.mn !== '없음') return;

      // 면접 필터
      if(hasInterview === true && !(pg.iv > 0)) return;
      if(hasInterview === false && pg.iv > 0) return;

      // grades에서 관련 등급 찾기
      let relevantGrade = null;
      if(pg.grades && majors.length > 0) {
        for(const m of majors) {
          const key = Object.keys(pg.grades).find(k => k.includes(m));
          if(key) { relevantGrade = pg.grades[key].avg; break; }
        }
        if(!relevantGrade) relevantGrade = pg.grades['인문']?.avg || pg.grades['자연']?.avg;
      }

      results.push({
        univ: u.nm, rg: u.rg, pgName: pg.n,
        quota: pg.q, cr: pg.cr, iv: pg.iv,
        mn: pg.mn, grade: relevantGrade,
        deptName: matchedDept?.d, deptQ: matchedDept?.q,
        deptCr: matchedDept?.cr
      });
    });
  });

  // 정렬: 합격등급 낮은 순 (좋은 순)
  results.sort((a,b) => (a.grade||9) - (b.grade||9));
  return results.slice(0, limit);
}

      '학교장추천': '📌 학교장추천전형\n학교에서 일정 인원을 추천하는 전형입니다. 추천 인원이 제한되어 경쟁이 치열하며, 내신 성적이 중요합니다. 서울대·연세대·고려대 등 상위권 대학에서 운영합니다.',
      '서류형': '📌 서류형 (1단계 서류 100%)\n학생부 서류만으로 선발하는 방식입니다. 면접이 없어 부담은 적지만 서류의 질이 당락을 결정합니다. 세특, 활동, 독서 기록이 핵심입니다.',
      '면접형': '📌 면접형 (1단계 서류→2단계 면접)\n1단계 서류 통과 후 2단계 면접을 봅니다. 서류 점수+면접 점수 합산으로 최종 선발합니다. 의약계열은 대부분 면접형이며, MMI(다중미니면접) 방식도 있습니다.',
      '교과전형': '📌 학생부교과전형\n내신 성적(교과 성적)만으로 선발하는 전형입니다. 학종과 달리 활동보다 성적이 절대적입니다. 수능최저를 요구하는 대학이 많습니다.',
      '정시': '📌 정시전형\n수능 성적으로 선발하는 전형입니다. 매년 12월 수능 후 1~2월 원서 접수합니다. 수시에서 미등록 충원이 많아 정시 실질 경쟁률은 다릅니다.',
      // 주요 개념
      '수능최저': '📌 수능최저기준\n학종에서 수능 성적이 일정 기준 이상이어야 최종 합격하는 조건입니다.\n예시: "2합8" = 2개 과목 등급 합 ≤8 / "3합10" = 3개 과목 합 ≤10\n수능최저를 충족 못 하면 서류·면접을 잘 봐도 불합격합니다.',
      '지역인재': '📌 지역인재전형\n해당 지역 고등학교 졸업(예정)자만 지원 가능한 전형입니다. 경쟁률이 일반전형보다 낮고 지역 학생에게 유리합니다. 제주 학생은 제주 소재 대학 지역인재전형을 적극 활용하세요.',
      '충원합격': '📌 충원합격(추가합격)\n최초합격자 미등록 시 대기 순번대로 합격이 돌아가는 제도입니다. 수시에서 충원합격 비율이 높은 대학도 있어, 포기하지 말고 기다리는 것이 중요합니다.',
      '세특': '📌 세부능력특기사항(세특)\n각 과목 교사가 수업 중 학생의 특이사항·탐구활동을 기록하는 항목입니다. 학종에서 가장 중요한 평가 요소 중 하나입니다. 수업 중 적극적인 질문·발표·탐구가 좋은 세특을 만듭니다.',
      '비교과': '📌 비교과 활동\n내신 성적 외의 학교 활동 전반을 말합니다. 동아리, 봉사, 학생회, 탐구활동, 독서, 수상실적(2024년부터 미반영) 등이 포함됩니다. 학종에서 진로 관련 비교과가 중요합니다.',
      '자소서': '📌 자기소개서(자소서)\n2024학년도부터 대부분 대학에서 폐지되었습니다. 현재는 학생부 기록만으로 평가하는 학교가 많습니다. 일부 대학은 여전히 자소서를 요구합니다.',
      '50%컷': '📌 50% cut (합격자 성적)\n합격자 중 위에서 50%에 해당하는 학생의 성적입니다. 실질적인 합격선의 기준으로 많이 사용합니다.',
      '70%컷': '📌 70% cut (합격자 성적)\n합격자 중 위에서 70%에 해당하는 학생의 성적입니다. 50%컷보다 낮으며, 실질적인 최저 합격선에 가깝습니다.',
      '모집요강': '📌 모집요강\n각 대학이 발표하는 수시/정시 모집 안내 문서입니다. 전형 방법, 모집인원, 수능최저, 제출서류 등이 담겨 있습니다. 반드시 해당 대학 홈페이지에서 직접 확인하세요.',
      '수시': '📌 수시전형\n9월~12월 사이에 원서를 접수하는 전형입니다. 학종, 교과전형, 논술전형 등이 포함됩니다. 최대 6개 대학에 지원 가능합니다.',
      '정원외': '📌 정원외전형\n농어촌학생, 기초생활수급자, 특수교육대상자 등을 위한 특별전형입니다. 일반 정원과 별도로 선발합니다.',
      '수시6장': '📌 수시 6회 제한\n수시는 전국 대학을 합쳐 최대 6개까지 지원할 수 있습니다. 단, 산업대·전문대·특기자 일부는 제한 없이 지원 가능합니다.',
      '학생부': '📌 학교생활기록부(학생부)\n고등학교 3년간의 학업·활동 기록 전체입니다. 내신성적, 출결, 수상경력, 자격증, 동아리, 봉사, 세특, 독서 등이 담깁니다. 학종의 가장 핵심 평가 자료입니다.',
      '내신': '📌 내신등급\n고등학교 교과 성적의 상대 등급입니다. 1등급(상위 4%)~9등급(하위)까지 있습니다. 학종에서는 내신이 절대적이지 않지만 중요한 참고 자료입니다.',
      '경쟁률': '📌 경쟁률\n모집인원 대비 지원자 수의 비율입니다. 예: 모집 10명에 100명 지원 = 10:1. 높을수록 경쟁이 치열합니다. 단, 실질 경쟁률(수능최저 충족자 기준)은 표면 경쟁률보다 낮습니다.',
      'MMI': '📌 MMI(다중미니면접)\n여러 개의 방에서 짧은 면접을 진행하는 방식입니다. 주로 의약계열에서 사용하며, 윤리적 판단·의사소통·문제해결 능력을 평가합니다.',
      '교과이수': '📌 권장 교과목 이수\n일부 대학은 특정 과목 이수를 권장 또는 필수로 요구합니다. 예: 의예과 지원 시 화학Ⅱ·생명과학Ⅱ 이수 권장. 미이수 시 불이익이 있을 수 있습니다.',
    };
    for(const [k,v] of Object.entries(explains)) {
      if(q.includes(k)) return {text: `${v}`, cards: []};
    }
    // 학과 정보 조회 (career 데이터)
    const majorInfo = MAJORS.find(m => q.includes(m.name.replace('/','').replace(' ','')) || 
                                        m.name.split('/').some(n=>q.includes(n.trim())));
    if(majorInfo && majorInfo.career) {
      const empLabel = {'S':'90%+ (최상)','A':'80%+ (우수)','B':'70%+ (보통)','C':'60%이하'};
      const salLabel = {'high':'높음 (4000만원+)','mid':'중간 (3000~4000만원)','low':'낮은편 (2500~3000만원)'};
      const prosLabel = {'up':'🔺 성장 (수요 증가 중)','stable':'➡️ 안정적','down':'🔻 감소 추세'};
      return {text: `📌 **${majorInfo.name}**\n\n` +
        `👔 관련 직업: ${majorInfo.career}\n` +
        `📊 취업률: ${empLabel[majorInfo.employRate]||'-'}\n` +
        `💰 초봉 수준: ${salLabel[majorInfo.salary]||'-'}\n` +
        `🔮 전망: ${prosLabel[majorInfo.prospect]||'-'}\n` +
        `${majorInfo.prospectDesc ? '\n'+majorInfo.prospectDesc : ''}\n\n` +
        `전략: ${majorInfo.strategy||''}`,
        cards: [{
          title: `${majorInfo.name} 지원 가능 대학 찾기`,
          sub: '내신 등급을 함께 말씀해주시면 더 정확해요',
          detail: '',
          action: `chatQuery('${majorInfo.name} 지원 가능한 대학')`
        }]};
    }
    return {text: '더 구체적으로 질문해 주세요.\n\n예시:\n• "학종이 뭐야"\n• "수능최저 설명해줘"\n• "간호학과 취업 전망"\n• "지역인재전형이 뭐야"', cards: []};
  }

  // ── 이전 대화 참조 ──
  if(intent === 'refer_prev' && chatContext.lastUnivs.length > 0) {
    const univName = chatContext.lastUnivs[0];
    const univ = UNIV_DB.find(u => u.nm === univName);
    if(univ) {
      const SKIP_KW = ['기회균형','농어촌','특수','재직'];
      const pgs = univ.pg.filter(p => !SKIP_KW.some(k => p.n.includes(k)));
      const cards = pgs.map(p => ({
        title: p.n, sub: `모집 ${p.q||'?'}명 | 경쟁률 ${p.cr||'?'}:1`,
        detail: `면접: ${p.iv>0?p.iv+'%':'없음'} | 수능최저: ${p.mn||'미적용'}`
      }));
      return {text: `**${univName}** 전형 정보입니다.`, cards};
    }
  }

  // ── 대학 정보 질문 ──
  if(intent === 'univ_info' && ent.univs.length > 0) {
    const univName = ent.univs[0];
    const univ = UNIV_DB.find(u => u.nm === univName);
    if(!univ) return {text: `${univName} 정보를 DB에서 찾을 수 없습니다.`, cards: []};
    const SKIP_KW = ['기회균형','농어촌','특수','재직','특성화','기초생활','장애인','국가보훈','고른기회','사회통합','보훈'];
    const pgs = univ.pg.filter(p => !SKIP_KW.some(k => p.n.includes(k)));
    chatContext.lastUnivs = [univName];
    const cards = pgs.map(p => {
      const gradeInfo = p.grades ? Object.entries(p.grades).slice(0,3).map(([k,v])=>`${k}: ${v.avg}등급`).join(', ') : '';
      return {
        title: p.n,
        sub: `모집 ${p.q||'?'}명 ${p.cr ? '| 경쟁률 '+p.cr+':1' : ''}`,
        detail: `면접: ${p.iv>0?p.iv+'%':'없음'} | 수능최저: ${p.mn||'미적용'}${gradeInfo?' | '+gradeInfo:''}`
      };
    });
    return {text: `**${univName}** (${univ.rg}) 학종 전형 목록입니다.`, cards};
  }

  // ── 수능최저 없는 전형 ──
  if(intent === 'suneung_query' && q.match(/없는|미적용|안보는/)) {
    const results = queryUnivs({majors, regions: regions.map(r=>toRgCode(r)).filter(Boolean), noSuneung: true, maxGrade: grade, limit:10});
    if(!results.length) return {text: '조건에 맞는 전형을 찾지 못했습니다.', cards: []};
    chatContext.lastUnivs = results.map(r=>r.univ);
    const regionText = regions.length ? regions[0]+' ' : '';
    const majorText = majors.length ? majors[0]+' ' : '';
    return {
      text: `수능최저 없는 ${regionText}${majorText}학종 전형 ${results.length}개입니다.`,
      cards: results.map(r => ({
        title: `${r.univ} - ${r.pgName}`,
        sub: `모집 ${r.quota||'?'}명 ${r.cr ? '| 경쟁률 '+r.cr+':1' : ''}`,
        detail: `면접: ${r.iv>0?r.iv+'%':'없음'} | 합격등급: ${r.grade||'?'}`
      }))
    };
  }

  // ── 대학 추천 / 지원 가능 ──
  if(intent === 'univ_recommend' || (grade && majors.length)) {
    if(!grade && !majors.length) {
      return {text: '내신 등급이나 희망 학과를 알려주시면 추천해드릴게요.\n예: "내신 2.8 간호학과 갈 수 있는 대학"', cards: []};
    }
    const rgCodes = regions.map(r => toRgCode(r)).filter(Boolean);
    const results = queryUnivs({majors, regions: rgCodes, maxGrade: grade, limit: 10});

    if(!results.length) {
      return {text: `조건에 맞는 전형을 찾지 못했습니다.\n${grade ? '내신 '+grade+'등급' : ''} ${majors.length ? majors.join('/') : ''} ${regions.length ? regions.join('/') : ''}\n\n조건을 완화하거나 다른 학과/지역을 시도해보세요.`, cards: []};
    }
    chatContext.lastUnivs = [...new Set(results.map(r=>r.univ))];
    const majorText = majors.length ? ` ${majors[0]} 관련` : '';
    const gradeText = grade ? ` 내신 ${grade}등급 기준` : '';
    const regionText = regions.length ? ` (${regions[0]} 지역)` : '';
    const suitable = results.filter(r => r.grade && grade && r.grade <= grade + 0.3);
    const reach   = results.filter(r => r.grade && grade && r.grade < grade - 0.2);

    let comment = '';
    if(suitable.length) comment = `적정권 ${suitable.length}개, `;
    if(reach.length) comment += `도전권 ${reach.length}개 포함`;

    return {
      text: `${gradeText}${majorText}${regionText} 지원 가능 전형 **${results.length}개**입니다. ${comment}`,
      cards: results.map(r => ({
        title: `${r.univ} - ${r.pgName}`,
        sub: `${r.deptName ? r.deptName+' ' : ''}모집 ${r.deptQ||r.quota||'?'}명 ${r.deptCr||r.cr ? '| 경쟁률 '+(r.deptCr||r.cr)+':1' : ''}`,
        detail: `합격등급: ${r.grade ? r.grade+'등급' : '?'} | 면접: ${r.iv>0?r.iv+'%':'없음'} | 수능최저: ${r.mn||'미적용'}`,
        tag: r.grade && grade ? (r.grade < grade-0.2 ? '도전' : r.grade <= grade+0.3 ? '적정' : '안정') : null,
        warning: getWarning(r.univ, r.grade)
      }))
    };
  }

  // ── 경쟁률 질문 ──
  if(intent === 'cr_query') {
    const SKIP_KW = ['기회균형','농어촌','특수','재직','특성화','기초생활','장애인','국가보훈'];
    let crData = [];
    UNIV_DB.forEach(u => {
      u.pg.filter(p=>!SKIP_KW.some(k=>p.n.includes(k))&&p.cr).forEach(pg => {
        if(majors.length && pg.dept) {
          const d = pg.dept.find(d=>majors.some(m=>d.d.includes(m)));
          if(d?.cr) crData.push({univ:u.nm, pg:pg.n, cr:d.cr, dept:d.d});
        } else if(!majors.length) {
          crData.push({univ:u.nm, pg:pg.n, cr:pg.cr});
        }
      });
    });
    const isHigh = q.includes('높은') || q.includes('인기');
    crData.sort((a,b) => isHigh ? b.cr-a.cr : a.cr-b.cr);
    const top = crData.slice(0,8);
    if(!top.length) return {text: '경쟁률 데이터가 있는 전형을 찾지 못했습니다.', cards: []};
    const label = isHigh ? '높은' : '낮은';
    return {
      text: `경쟁률 ${label} 전형 TOP ${top.length}입니다.`,
      cards: top.map(r => ({
        title: `${r.univ}${r.dept?' - '+r.dept:''} - ${r.pg}`,
        sub: `경쟁률 ${r.cr}:1`,
        detail: ''
      }))
    };
  }

  // ── 내신 등급 질문 ──
  if(intent === 'grade_query' && majors.length) {
    const SKIP_KW = ['기회균형','농어촌','특수','재직'];
    let gradeData = [];
    UNIV_DB.forEach(u => {
      u.pg.filter(p=>!SKIP_KW.some(k=>p.n.includes(k))).forEach(pg => {
        if(!pg.grades) return;
        majors.forEach(m => {
          const key = Object.keys(pg.grades).find(k=>k.includes(m));
          if(key) gradeData.push({univ:u.nm, pg:pg.n, grade:pg.grades[key].avg, key});
        });
      });
    });
    if(!gradeData.length) return {text: `${majors[0]} 합격자 성적 데이터를 찾지 못했습니다.`, cards: []};
    gradeData.sort((a,b)=>a.grade-b.grade);
    return {
      text: `${majors[0]} 합격자 평균 등급 현황입니다. (낮을수록 좋음)`,
      cards: gradeData.slice(0,10).map(r => ({
        title: `${r.univ} - ${r.pg}`,
        sub: `합격 평균 ${r.grade}등급`,
        detail: '',
        warning: getWarning(r.univ, r.grade)
      }))
    };
  }

  // ── 학과 추천 ──
  if(intent === 'major_recommend') {
    const isNatural = /이과|자연|수학|과학|공학|이공/.test(q);
    const isHuman = /문과|인문|사회|국어|역사|문학/.test(q);
    const isJob = /취업|직업|연봉|돈|현실|안정/.test(q);
    const isProspect = /전망|미래|유망|성장|뜨는/.test(q);
    const isArt = /예체능|예술|미술|음악|체육|디자인/.test(q);

    // MAJORS에서 조건에 맞는 학과 필터링
    let filtered = MAJORS.filter(m => m.career); // career 있는 학과만
    if(isNatural) filtered = filtered.filter(m => ['의약','이공','공학','자연'].some(f=>m.field.includes(f)));
    else if(isHuman) filtered = filtered.filter(m => ['인문','사회'].some(f=>m.field.includes(f)));
    else if(isArt) filtered = filtered.filter(m => ['예술','체육'].some(f=>m.field.includes(f)));

    if(isJob) filtered = filtered.filter(m => ['S','A'].includes(m.employRate)).sort((a,b)=>a.employRate.localeCompare(b.employRate));
    else if(isProspect) filtered = filtered.filter(m => m.prospect === 'up');
    else if(isNatural || isHuman) filtered.sort((a,b) => (a.employRate||'C').localeCompare(b.employRate||'C'));

    const topMajors = filtered.slice(0, 6);
    const empLabel = {'S':'취업률 최상','A':'취업률 우수','B':'취업률 보통','C':'취업률 낮음'};
    const salLabel = {'high':'고연봉','mid':'중간연봉','low':'낮은편'};
    const prosLabel = {'up':'🔺 성장중','stable':'➡️ 안정','down':'🔻 감소'};

    const label = isNatural?'이과':isHuman?'문과':isArt?'예체능':'';
    const condLabel = isJob?' 취업 중심':isProspect?' 유망분야':'';
    return {
      text: `**${label}${condLabel} 추천 학과**입니다. 학과 카드를 클릭하면 지원 가능한 대학을 찾아드려요.`,
      cards: topMajors.map(m=>({
        title: m.name,
        sub: `${empLabel[m.employRate]||''} | ${salLabel[m.salary]||''} | ${prosLabel[m.prospect]||''}`,
        detail: m.career ? '관련직업: '+m.career.split(',').slice(0,3).join(', ') : '',
        action: `chatQuery('${m.name} 지원 가능한 대학 알려줘')`
      }))
    };
  }

  // ── 기본 응답 ──
  return {
    text: `죄송해요, 질문을 잘 이해하지 못했어요. 이렇게 물어보세요:\n\n• "내신 3.2로 간호학과 갈 수 있는 대학"\n• "제주대 전형 알려줘"\n• "수능최저 없는 서울 학종"\n• "간호학과 경쟁률 높은 대학"\n• "학종이 뭐야"`,
    cards: []
  };
}

window.chatSend = function() {
  const input = document.getElementById('chatInput');
  const q = input.value.trim();
  if(!q) return;
  input.value = '';

  chatHistory.push({role:'user', text:q});

  const intent = detectIntent(q);
  const ent = extractEntities(q);
  const resp = generateResponse(q, intent, ent);

  chatHistory.push({role:'bot', text:resp.text, cards:resp.cards||[]});
  if(chatHistory.length > 20) chatHistory = chatHistory.slice(-20);

  renderChatMessages();
  setTimeout(()=>{
    const box = document.getElementById('chatMessages');
    if(box) box.scrollTop = box.scrollHeight;
  }, 50);
};

window.chatQuery = function(q) {
  document.getElementById('chatInput').value = q;
  chatSend();
};

function renderChatMessages() {
  const box = document.getElementById('chatMessages');
  if(!box) return;

  const tagColor = {도전:'rgba(248,113,113,.15)', 적정:'rgba(52,211,153,.15)', 안정:'rgba(56,189,248,.15)'};
  const tagText  = {도전:'var(--red)', 적정:'var(--green)', 안정:'var(--accent)'};

  box.innerHTML = chatHistory.map(m => {
    if(m.role === 'user') {
      return `<div style="display:flex;justify-content:flex-end;margin-bottom:10px">
        <div style="background:var(--accent);color:#fff;padding:8px 12px;border-radius:14px 14px 4px 14px;max-width:75%;font-size:.8rem;line-height:1.5">${m.text}</div>
      </div>`;
    }
    // bot 메시지
    const textHtml = m.text.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\n/g,'<br>');
    const cardsHtml = (m.cards||[]).map(c => `
      <div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:6px;cursor:pointer;transition:border-color .2s" 
           onclick="${c.action||''}" onmouseover="this.style.borderColor='var(--accent)'" onmouseout="this.style.borderColor='var(--border)'">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-size:.78rem;font-weight:600">${c.title}</div>
          ${c.tag?`<span style="font-size:.65rem;padding:2px 6px;border-radius:4px;background:${tagColor[c.tag]||''};color:${tagText[c.tag]||''}">${c.tag}</span>`:''}
        </div>
        ${c.sub?`<div style="font-size:.7rem;color:var(--text2);margin-top:3px">${c.sub}</div>`:''}
        ${c.detail?`<div style="font-size:.65rem;color:var(--text3);margin-top:2px">${c.detail}</div>`:''}
        ${c.warning?`<div style="font-size:.65rem;color:#f59e0b;margin-top:4px;padding:3px 6px;background:rgba(245,158,11,.1);border-radius:4px;border-left:2px solid #f59e0b">⚠️ ${c.warning}</div>`:''}
      </div>`).join('');
    return `<div style="display:flex;gap:8px;margin-bottom:10px;align-items:flex-start">
      <div style="font-size:1.2rem;flex-shrink:0">🧭</div>
      <div style="flex:1;min-width:0">
        <div style="background:var(--card);border:1px solid var(--border);padding:10px 12px;border-radius:4px 14px 14px 14px;font-size:.8rem;line-height:1.6;color:var(--text)">${textHtml}</div>
        ${cardsHtml}
      </div>
    </div>`;
  }).join('');
}

window.saveConsultRecord = async function() {
  if(!profileUser || !profileData) {
    alert('프로필에 로그인 후 사용하세요.');
    return;
  }
  const idStr = String(profileUser);
  // 학번 파싱: 10101 → 학년1 반01 번호01
  const grade_yr = idStr[0] || '?';
  const class_no = idStr.slice(1,3) || '?';
  const stu_no   = idStr.slice(3,5) || '?';

  // 현재 지원 가능 대학 목록 계산
  const univs = getUnivs ? getUnivs() : [];
  const topUnivs = univs.slice(0,10).map(u => u.nm);

  const record = {
    sid: profileUser,
    name: profileData.name || '',
    grade_yr,
    class_no,
    stu_no,
    inner_grade: profileData.grade || '',
    major: profileData.major || '',
    target: profileData.target || '',
    top_univs: JSON.stringify(topUnivs),
    univ_count: univs.length,
    saved_at: new Date().toISOString().replace('T',' ').slice(0,19)
  };

  try {
    const res = await fetch('/api/consult/save/', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify(record)
    });
    const r = await res.json();
    if(r.ok) {
      alert('✅ 상담 기록이 저장되었습니다.\n담임 선생님이 학급 현황에서 확인하실 수 있습니다.');
    } else {
      alert('저장 실패: ' + (r.error || '알 수 없는 오류'));
    }
  } catch(e) {
    alert('서버 연결 오류: ' + e.message);
  }
};

// 담임 인증 및 반 데이터 로드
window.doClassAuth = async function() {
  const pw = document.getElementById('class_pw_input').value;
  const cls = document.getElementById('class_select').value;
  if(!pw) { alert('비밀번호를 입력하세요'); return; }

  try {
    const res = await fetch(`/api/consult/class/?class_no=${cls}&pw=${encodeURIComponent(pw)}`);
    const r = await res.json();
    if(r.ok) {
      classAuth = true;
      classTarget = cls;
      classData = r.students || [];
      render();
    } else {
      alert('❌ ' + (r.error || '인증 실패'));
    }
  } catch(e) {
    alert('서버 연결 오류');
  }
};

window.exportClassCSV = function() {
  if(!classData.length) return;
  const header = ['학번','이름','학년','반','번호','내신등급','희망학과','희망대학','지원가능수','저장일시'];
  const rows = classData.map(s => [
    s.sid, s.name, s.grade_yr, s.class_no, s.stu_no,
    s.inner_grade, s.major, s.target,
    s.univ_count, s.saved_at
  ]);
  const csv = [header, ...rows].map(r => r.map(v => `"${(v||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `학급현황_${classTarget}반_${new Date().toISOString().split('T')[0]}.csv`;
  a.click();
};

      </div>
      <div class="profile-card" style="padding:14px;text-align:center">
        <div style="font-size:1.6rem;font-weight:700;color:#f59e0b">${topMajors[0]?topMajors[0][0]:'미입력'}</div>
        <div style="font-size:.72rem;color:var(--text3)">최다 희망학과</div>

    <!-- 2단 통계 -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">

        <div style="font-size:.82rem;font-weight:600;margin-bottom:10px">🎯 희망학과 분포</div>

            <div style="font-size:.7rem;color:var(--text3);width:30px;text-align:right">${cnt}명</div>

    <!-- 학생 목록 테이블 -->
    <div class="profile-card" style="padding:14px;overflow-x:auto">
      <div style="font-size:.82rem;font-weight:600;margin-bottom:10px">👩‍🎓 학생별 상세</div>

              <td style="padding:7px 8px">
                <span style="background:${parseFloat(s.inner_grade)<=2?'rgba(52,211,153,.15)':parseFloat(s.inner_grade)<=3?'rgba(56,189,248,.15)':'rgba(251,191,36,.15)'};padding:2px 6px;border-radius:4px;color:${parseFloat(s.inner_grade)<=2?'var(--green)':parseFloat(s.inner_grade)<=3?'var(--accent)':'#f59e0b'}">
                  ${s.inner_grade||'-'}

              </td>
              <td style="padding:7px 8px">${s.major||'-'}</td>

function renderC(){
  const univCount=UNIV_DB.length, progCount=UNIV_DB.reduce((s,u)=>s+u.pg.length,0), quotaTotal=UNIV_DB.reduce((s,u)=>s+u.pg.reduce((ss,p)=>ss+p.q,0),0);
  
  // 데이터 품질 분석
  const regions=['서울','경인','강원','충청','호남','대경','동남','제주'];
  const regionStats=regions.map(r=>{
    const us=UNIV_DB.filter(u=>u.rg===r);
    const pgs=us.reduce((s,u)=>s+u.pg.length,0);
    const qt=us.reduce((s,u)=>s+u.pg.reduce((ss,p)=>ss+p.q,0),0);
    const withDept=us.filter(u=>u.pg.some(p=>p.dept&&p.dept.length>0)).length;
    const withCR=us.reduce((s,u)=>s+u.pg.filter(p=>p.cr).length,0);
    return {r,count:us.length,pgs,qt,withDept,withCR};
  });
  
  // 대학별 데이터 품질 목록
  const univDetails=UNIV_DB.map(u=>{
    const pgs=u.pg.length;
    const hasDept=u.pg.some(p=>p.dept&&p.dept.length>0);
    const deptCount=u.pg.reduce((s,p)=>s+(p.dept?p.dept.length:0),0);
    const hasCR=u.pg.some(p=>p.cr);
    const crCount=u.pg.filter(p=>p.cr).length;
    const hasIntv=u.pg.some(p=>p.iv);
    const hasMn=u.pg.some(p=>p.mn);
    const totalQ=u.pg.reduce((s,p)=>s+p.q,0);
    // 데이터 완성도 점수 (0~5)
    let score=0;
    if(pgs>0)score++;       // 전형 데이터 있음
    if(hasCR)score++;        // 경쟁률 있음
    if(hasIntv||hasMn)score++; // 면접/수능최저 있음
    if(hasDept)score++;      // 학과별 데이터
    if(deptCount>=3)score++; // 학과 3개 이상
    return {...u,pgs,hasDept,deptCount,hasCR,crCount,hasIntv,hasMn,totalQ,score};
  }).sort((a,b)=>a.score-b.score); // 낮은 점수 먼저 (보완 필요한 대학 상단)
  
  const scoreColors=['var(--red)','var(--red)','var(--amber)','var(--amber)','var(--green)','var(--green)'];
  const scoreLabels=['매우 부족','부족','기본','양호','우수','완전'];
  
  // DB 필터 상태
  const dbFilterRegion=window._dbFilterRegion||'전체';
  const dbFilterScore=window._dbFilterScore||'전체';
  const dbSearchText=window._dbSearchText||'';
  
  let filtered=univDetails;
  if(dbFilterRegion!=='전체') filtered=filtered.filter(u=>u.rg===dbFilterRegion);
  if(dbFilterScore!=='전체') filtered=filtered.filter(u=>u.score<=parseInt(dbFilterScore));
  if(dbSearchText) filtered=filtered.filter(u=>u.nm.includes(dbSearchText));
  
  return `<div class="step"><div class="step-title"><div class="step-num">⚙</div><div class="step-label">DB 관리 — 데이터 현황 & 업데이트</div></div>
    
    <div class="db-panel"><h3>📊 DB 현황 요약</h3>
    <div class="db-info" style="grid-template-columns:repeat(5,1fr)">
      <div class="db-info-item"><div class="val">${univCount}</div><div class="lbl">대학</div></div>
      <div class="db-info-item"><div class="val">${progCount}</div><div class="lbl">학종 전형</div></div>
      <div class="db-info-item"><div class="val">${quotaTotal.toLocaleString()}</div><div class="lbl">총 모집인원</div></div>
      <div class="db-info-item"><div class="val">${UNIV_DB.filter(u=>u.pg.some(p=>p.dept)).length}</div><div class="lbl">학과별 데이터</div></div>
      <div class="db-info-item"><div class="val">${UNIV_DB.reduce((s,u)=>s+u.pg.filter(p=>p.cr).length,0)}</div><div class="lbl">경쟁률 보유</div></div>
    </div>
    <div style="font-size:.75rem;color:var(--text2);margin-top:8px">버전: <b>${dbMeta.version}</b> · 업데이트: ${dbMeta.date} · 소스: ${dbMeta.source}</div>
    </div>

    <div class="db-panel"><h3>🗺️ 권역별 현황</h3>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px">
      ${regionStats.map(rs=>`
        <div style="background:var(--card2);border-radius:8px;padding:10px;border:1px solid var(--border)">
          <div style="font-size:.8rem;font-weight:700;margin-bottom:4px">${rs.r}</div>
          <div style="font-size:.68rem;color:var(--text2);line-height:1.7">
            대학 <b style="color:var(--text)">${rs.count}</b>개<br>
            전형 <b style="color:var(--text)">${rs.pgs}</b>개<br>
            모집 <b style="color:var(--text)">${rs.qt.toLocaleString()}</b>명<br>
            학과DB <span style="color:${rs.withDept>0?'var(--green)':'var(--red)'}"><b>${rs.withDept}</b>/${rs.count}</span><br>
            경쟁률 <span style="color:${rs.withCR>0?'var(--green)':'var(--red)'}"><b>${rs.withCR}</b>/${rs.pgs}</span>
          </div>
        </div>
      `).join('')}
    </div></div>

    <div class="db-panel"><h3>🏫 대학별 데이터 현황 (${filtered.length}/${univCount}개)</h3>

      <select style="padding:6px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;font-family:inherit" onchange="window._dbFilterRegion=this.value;render()">

      </select>
      <select style="padding:6px 10px;border-radius:12px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:.78rem;font-family:inherit" onchange="window._dbFilterScore=this.value;render()">

        <option value="2" ${dbFilterScore==='2'?'selected':''}>📝 기본 수준 (0~2점)</option>

function rUP(univs, matchedMajors){
  const mj=selMaj?MAJORS.find(x=>x.id===selMaj):null;
  const isModeB=mode==='B'&&mj;
  const mjKw=mj?mj.keywords:[];
  
  // 모드A: 매칭된 학과들의 키워드 수집
  const isModeA=mode==='A'&&matchedMajors&&matchedMajors.length>0;
  const allMajorKw=isModeA?[...new Set(matchedMajors.flatMap(m=>m.keywords))]:[];
  const allMajorNames=isModeA?matchedMajors.map(m=>m.name):[];
  
  // 안내문
  let contextNote='';
  if(isModeB){
    const hasDept=univs.some(u=>u.mp.some(p=>p.dept&&p.dept.length>0));
    if(hasDept){
      contextNote=`<div style="font-size:.72rem;color:var(--green);padding:8px 12px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.15);border-radius:8px;margin-bottom:10px">✅ <b>●</b> 표시가 있는 학과는 학과별 모집인원·경쟁률 데이터가 제공됩니다. 나머지는 전형 전체 기준이며, 학과별 상세는 각 대학 모집요강을 참조하세요.</div>`;
    } else {
      contextNote=`<div style="font-size:.72rem;color:var(--amber);padding:8px 12px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.15);border-radius:8px;margin-bottom:10px">⚠️ 아래 모집인원·경쟁률은 <b>전형 전체</b> 기준입니다. 학과별 세부 데이터는 각 대학 모집요강에서 확인하세요.</div>`;
    }
  } else if(isModeA){
    contextNote=`<div style="font-size:.72rem;color:var(--green);padding:8px 12px;background:rgba(52,211,153,.06);border:1px solid rgba(52,211,153,.15);border-radius:8px;margin-bottom:10px">✅ 매칭된 학과(${allMajorNames.slice(0,5).join(', ')}${allMajorNames.length>5?' 등':''})의 학과별 모집인원·경쟁률이 <b>●</b>로 표시됩니다. 학과 카드를 클릭하면 해당 학과 상세 전략을 확인할 수 있습니다.</div>`;
  }
  
  // 합격 가능성 그룹 카운트
  let grpCount={safe:0,fit:0,challenge:0,reach:0,nodata:0};
  if(myGrade>0){
    univs.forEach(u=>{
      const best=u.mp.reduce((b,p)=>{if(!p.grades)return b;const g=p.grades['인문']||p.grades['자연'];return g?Math.min(b,g.avg):b},99);
      if(best>=99){grpCount.nodata++}
      else{const diff=best-myGrade;if(diff>=1.0)grpCount.safe++;else if(diff>=0.3)grpCount.fit++;else if(diff>=-0.3)grpCount.challenge++;else grpCount.reach++}
    });
    const total=grpCount.safe+grpCount.fit+grpCount.challenge+grpCount.reach;
    if(total>0){
      contextNote+=`<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
        ${grpCount.safe?'<div style="flex:1;min-width:80px;text-align:center;padding:8px;border-radius:8px;background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.2)"><div style="font-size:1.1rem;font-weight:800;color:var(--green)">'+grpCount.safe+'</div><div style="font-size:.65rem;color:var(--green)">✅ 안정</div></div>':''}
        ${grpCount.fit?'<div style="flex:1;min-width:80px;text-align:center;padding:8px;border-radius:8px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2)"><div style="font-size:1.1rem;font-weight:800;color:var(--amber)">'+grpCount.fit+'</div><div style="font-size:.65rem;color:var(--amber)">🔶 적정</div></div>':''}
        ${grpCount.challenge?'<div style="flex:1;min-width:80px;text-align:center;padding:8px;border-radius:8px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2)"><div style="font-size:1.1rem;font-weight:800;color:var(--red)">'+grpCount.challenge+'</div><div style="font-size:.65rem;color:var(--red)">🔺 도전</div></div>':''}
        ${grpCount.reach?'<div style="flex:1;min-width:80px;text-align:center;padding:8px;border-radius:8px;background:rgba(100,116,139,.08);border:1px solid rgba(100,116,139,.2)"><div style="font-size:1.1rem;font-weight:800;color:var(--text3)">'+grpCount.reach+'</div><div style="font-size:.65rem;color:var(--text3)">⬆ 상향</div></div>':''}
      </div>`;
    }
  }
  return contextNote+univs.map(u=>{
    const io=openP.has(u.nm);
    
    // 학과 키워드로 dept 매칭 찾기 (모드A: 전체 매칭학과, 모드B: 선택학과)
    const activeKw=isModeB?mjKw:isModeA?allMajorKw:[];
    let deptMatches=[];
    if(activeKw.length>0){
      u.mp.forEach(p=>{
        if(p.dept){
          p.dept.forEach(d=>{
            if(activeKw.some(k=>d.d.toLowerCase().includes(k.toLowerCase()))){
              // 어떤 학과와 매칭되는지 찾기
              const matchedName=isModeB?mj.name:
                (matchedMajors||[]).find(mm=>mm.keywords.some(k=>d.d.toLowerCase().includes(k.toLowerCase())))?.name||d.d;
              deptMatches.push({prog:p.n,dept:d.d,q:d.q,cr:d.cr,majorName:matchedName});
            }
          });
        }
      });
    }
    
    // 헤더 배지
    const deptQuota=deptMatches.reduce((s,d)=>s+d.q,0);
    const headerBadge=deptMatches.length>0
      ?`<span class="pbadge c">${deptMatches.length}개 학과 ${deptQuota}명</span>`
      :`<span class="pbadge c">${u.mp.length}개 전형</span>`;
    
    // 테이블 렌더링
    let tableRows='';
    if(deptMatches.length>0){
      // 학과별 데이터 테이블
      const label=isModeB?mj.name:'매칭 학과';
      tableRows=`<div style="font-size:.7rem;color:var(--accent);font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:4px">● ${label} 학과별 모집 정보</div>`;
      tableRows+=`<table class="utbl"><thead><tr><th>전형명 / 학과</th><th>학과 모집인원</th><th>전형방법</th><th>면접</th><th>수능최저</th><th>학과 경쟁률</th></tr></thead><tbody>`;
      deptMatches.forEach(dm=>{
        const p=u.mp.find(x=>x.n===dm.prog);
        tableRows+=`<tr style="background:rgba(56,189,248,.04)"><td class="uname">${dm.prog}<br><span style="font-size:.65rem;color:var(--accent)">→ ${dm.dept}</span></td><td style="font-weight:700;color:var(--accent)">${dm.q}명</td><td style="max-width:170px;font-size:.7rem">${p?p.m:''}</td><td>${p&&p.iv?`<span class="tag tag-iv">면접${typeof p.iv==='number'?' '+p.iv+'%':''}</span>`:'<span class="tag tag-no">X</span>'}</td><td>${p&&p.mn?`<span class="tag tag-mn">O</span><span style="font-size:.55rem;color:var(--text3);margin-left:2px">${(p.mn||'').substring(0,35)}${(p.mn||'').length>35?'…':''}</span>`:'<span class="tag tag-no">X</span>'}</td><td style="font-weight:700;color:var(--accent)">${dm.cr?dm.cr+':1':'-'}</td></tr>`;
      });
      // 나머지 전형
      const shownProgs=new Set(deptMatches.map(dm=>dm.prog));
      const otherProgs=u.mp.filter(p=>!shownProgs.has(p.n));
      if(otherProgs.length>0){
        tableRows+=`<tr><td colspan="6" style="font-size:.68rem;color:var(--text3);padding:8px;text-align:center;cursor:pointer" onclick="this.parentNode.querySelectorAll('.other-row').forEach(r=>r.style.display=r.style.display==='none'?'table-row':'none');this.textContent=this.textContent.includes('▼')?'기타 전형 접기 ▲':'기타 ${otherProgs.length}개 전형 보기 ▼'">기타 ${otherProgs.length}개 전형 보기 ▼</td></tr>`;
        otherProgs.forEach(p=>{
          tableRows+=`<tr class="other-row" style="display:none"><td class="uname">${p.n}</td><td>${p.q.toLocaleString()}명 <span style="font-size:.5rem;color:var(--text3)">(전형전체)</span></td><td style="max-width:170px;font-size:.7rem">${p.m}</td><td>${p.iv?`<span class="tag tag-iv">면접${typeof p.iv==='number'?' '+p.iv+'%':''}</span>`:'<span class="tag tag-no">X</span>'}</td><td>${p.mn?`<span class="tag tag-mn">O</span>`:'<span class="tag tag-no">X</span>'}</td><td>${p.cr?p.cr+':1':'-'}</td></tr>`;
        });
      }
      tableRows+=`</tbody></table>`;
    } else {
      // 기본 테이블 (전형 전체)
      tableRows=`<table class="utbl"><thead><tr><th>전형명</th><th>모집인원</th><th>전형방법</th><th>면접</th><th>수능최저</th><th>경쟁률</th></tr></thead><tbody>`;
      u.mp.forEach(p=>{
        const hasKw=activeKw.length>0&&activeKw.some(k=>((p.mn||'')+(p.n||'')).toLowerCase().includes(k.toLowerCase()));
        const rs=hasKw?'background:rgba(56,189,248,.04)':'';
        tableRows+=`<tr style="${rs}"><td class="uname">${p.n}</td><td>${p.q.toLocaleString()}명 <span style="font-size:.5rem;color:var(--text3)">(전형전체)</span></td><td style="max-width:170px;font-size:.7rem">${p.m}</td><td>${p.iv?`<span class="tag tag-iv">면접${typeof p.iv==='number'?' '+p.iv+'%':''}</span>`:'<span class="tag tag-no">X</span>'}</td><td>${p.mn?`<span class="tag tag-mn">O</span>`:'<span class="tag tag-no">X</span>'}</td><td>${p.cr?p.cr+':1':'-'}</td></tr>`;
      });
      tableRows+=`</tbody></table>`;
    }
    
    return`<div class="panel"><div class="panel-hd" onclick="TP('${u.nm}')"><div style="display:flex;align-items:center;gap:7px"><span class="panel-tl">${u.nm}</span><span class="pbadge f">${u.rg}·${u.lc}</span></div><div style="display:flex;gap:5px;align-items:center">${headerBadge}${(()=>{
      if(!myGrade) return '';
      const bestGrade=u.mp.reduce((best,p)=>{
        if(!p.grades) return best;
        const g=p.grades['인문']||p.grades['자연']||p.grades['간호']||p.grades['의예']||p.grades['약학'];
        return g?Math.min(best,g.avg):best;
      },99);
      if(bestGrade>=99) return '';
      const diff=bestGrade-myGrade;
      // 일반고 경고: 대학 그룹별 기준 적용
      const isTopUniv1=['서울대학교','연세대학교','고려대학교','포항공과대학교','KAIST','GIST','DGIST','UNIST','KENTECH'].includes(u.nm);
      const isTopUniv2=['성균관대학교','한양대학교','이화여자대학교','서강대학교','중앙대학교','경희대학교','한국외국어대학교','서울시립대학교'].includes(u.nm);
      const isTopUniv3=['건국대학교','동국대학교','홍익대학교','숙명여자대학교','숭실대학교','광운대학교','국민대학교','세종대학교','단국대학교','인하대학교','아주대학교'].includes(u.nm);
      const warn1 = isTopUniv1 && bestGrade <= 2.5;
      const warn2 = isTopUniv2 && bestGrade <= 3.0;
      const warn3 = isTopUniv3 && bestGrade <= 2.5;
      const warn4 = !isTopUniv1 && !isTopUniv2 && !isTopUniv3 && bestGrade <= 1.8;
      const warnBadge=(warn1||warn2||warn3||warn4)
        ?'<span class="pbadge" style="background:rgba(245,158,11,.15);color:#f59e0b" title="특목·자사고 합격자 비율이 높거나 전국 단위 경쟁 대학입니다. 일반고 실질 합격선은 더 높을 수 있으니 담임 선생님과 상담하세요.">⚠️ 일반고 주의</span>'
        :'';
      if(diff>=1.0) return warnBadge+'<span class="pbadge" style="background:rgba(52,211,153,.15);color:var(--green)">✅ 안정</span>';
      if(diff>=0.3) return warnBadge+'<span class="pbadge" style="background:rgba(251,191,36,.15);color:var(--amber)">🔶 적정</span>';
      if(diff>=-0.3) return warnBadge+'<span class="pbadge" style="background:rgba(248,113,113,.15);color:var(--red)">🔺 도전</span>';
      return '<span class="pbadge" style="background:rgba(248,113,113,.1);color:var(--text3)">⬆ 상향</span>';
    })()}<span class="parrow ${io?'open':''}">▼</span></div></div><div class="panel-bd ${io?'open':''}">${tableRows}</div></div>`;
  }).join('');
}
