<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>직업 나침반 🧭</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, '맑은 고딕', sans-serif;
  background: linear-gradient(180deg, #0f172a 0%, #0c0f1a 100%);
  color: #f1f5f9; min-height: 100vh;
}
a { text-decoration: none; color: inherit; }
button { font-family: inherit; cursor: pointer; }

/* 스크롤바 */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

/* 통합 최상단 내비게이션 */
.super-nav{position:sticky;top:0;z-index:9999;background:linear-gradient(135deg,#060a14 0%,#0d1320 100%);border-bottom:1px solid rgba(255,255,255,0.08);padding:0 16px;backdrop-filter:blur(12px)}
.super-nav-inner{max-width:1200px;margin:0 auto;display:flex;align-items:center;gap:0;height:46px}
.super-nav-logo{display:flex;align-items:center;gap:8px;margin-right:28px;cursor:pointer;text-decoration:none;color:inherit}
.super-nav-logo span:first-child{font-size:22px}
.super-nav-logo span:last-child{font-weight:800;font-size:16px;background:linear-gradient(90deg,#38bdf8,#818cf8,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.super-nav-links{display:flex;gap:2px}
.super-nav-link{display:flex;align-items:center;gap:6px;padding:12px 18px;color:#64748b;font-size:13px;font-weight:700;text-decoration:none;border-bottom:2px solid transparent;transition:all .2s}
.super-nav-link:hover{color:#94a3b8}
.super-nav-link.active{color:#38bdf8;border-bottom-color:#38bdf8;background:rgba(56,189,248,0.05)}
.super-nav-link .nav-emoji{font-size:15px}

/* 네비게이션 */
#nav {
  position: sticky; top: 46px; z-index: 100;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  border-bottom: 1px solid rgba(255,255,255,0.1);
  padding: 0 16px;
}
.nav-inner {
  max-width: 1200px; margin: 0 auto;
  display: flex; align-items: center; gap: 8;
}
.nav-logo {
  padding: 12px 0; display: flex; align-items: center; gap: 8;
  margin-right: 24; cursor: pointer;
}
.nav-logo-text {
  font-weight: 800; font-size: 18;
  background: linear-gradient(90deg, #60a5fa, #a78bfa);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
.nav-tabs { display: flex; gap: 2; }
.nav-tab {
  background: transparent; border: none;
  color: #94a3b8; padding: 14px 14px; font-size: 13; font-weight: 600;
  border-bottom: 2px solid transparent;
  display: flex; align-items: center; gap: 6; transition: all 0.2s;
}
.nav-tab.active {
  background: rgba(96,165,250,0.15); color: #60a5fa;
  border-bottom-color: #60a5fa;
}
.nav-tab:hover { color: #60a5fa; }

/* 컨테이너 */
.container { max-width: 1200px; margin: 0 auto; padding: 24px 16px; }
.container-sm { max-width: 800px; margin: 0 auto; padding: 24px 16px; }
.container-md { max-width: 1000px; margin: 0 auto; padding: 24px 16px; }

/* 카드 그리드 */
.card-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16;
}

/* 직업 카드 */
.job-card {
  background: #1e293b; border-radius: 16px; padding: 20px;
  border: 1px solid rgba(255,255,255,0.06);
  transition: all 0.25s ease; position: relative; overflow: hidden; cursor: pointer;
}
.job-card:hover { transform: translateY(-4px); }
.job-card-header { display: flex; align-items: center; gap: 12; margin-bottom: 12; }
.job-card-icon {
  width: 48px; height: 48px; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.job-card-name { font-size: 15px; font-weight: 700; color: #f1f5f9; }
.job-card-cat { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4; }
.job-card-desc { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-bottom: 12; }
.job-card-tags { display: flex; gap: 6; flex-wrap: wrap; }
.job-card-tag {
  font-size: 11px; padding: 3px 8px; border-radius: 6px;
  background: rgba(255,255,255,0.06); color: #cbd5e1;
}
.job-card-salary {
  position: absolute; top: 12px; right: 12px; font-size: 11px; color: #64748b;
}

/* 필터 버튼 */
.filter-group { display: flex; gap: 8; flex-wrap: wrap; justify-content: center; margin-bottom: 24; }
.filter-btn {
  padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600;
  border: 1px solid rgba(255,255,255,0.1); background: transparent; color: #94a3b8;
  transition: all 0.2s;
}
.filter-btn.active { border: none; color: #fff; }

/* 검색 */
.search-box {
  width: 100%; max-width: 420px; padding: 12px 16px; border-radius: 12px;
  border: 1px solid rgba(255,255,255,0.1); background: #1e293b;
  color: #f1f5f9; font-size: 14px; outline: none; font-family: inherit;
}
.search-box::placeholder { color: #64748b; }
.search-box:focus { border-color: #60a5fa; }

/* 패널 */
.panel {
  background: #1e293b; border-radius: 16px; padding: 24px;
  border: 1px solid rgba(255,255,255,0.06);
}

/* 탭 버튼 */
.tab-group { display: flex; gap: 4; margin-bottom: 24; overflow-x: auto; }
.tab-btn {
  padding: 10px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
  border: none; white-space: nowrap; transition: all 0.2s;
  background: rgba(255,255,255,0.05); color: #94a3b8;
}
.tab-btn.active { color: #fff; }

/* 상세 헤더 */
.detail-header {
  border-radius: 20px; padding: 28px; margin-bottom: 24;
}
.detail-header-row { display: flex; align-items: center; gap: 16; margin-bottom: 12; }
.detail-icon {
  width: 64px; height: 64px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center; font-size: 36px;
}
.detail-title { font-size: 24px; font-weight: 800; }
.detail-cat { font-size: 13px; font-weight: 600; margin-top: 4; }
.detail-oneliner { color: #cbd5e1; font-size: 15px; line-height: 1.6; }

/* 연봉 박스 */
.salary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12; margin-bottom: 16; }
.salary-box {
  border-radius: 12px; padding: 16px; text-align: center;
}
.salary-label { color: #94a3b8; font-size: 12px; margin-bottom: 6; }
.salary-value { font-size: 18px; font-weight: 800; }

/* 트렌드 아이템 */
.trend-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: rgba(255,255,255,0.03); border-radius: 10px;
  margin-bottom: 8;
}
.trend-label { color: #cbd5e1; font-size: 13px; }
.trend-icon { font-size: 18px; }

/* 적성 아이템 */
.apt-item {
  padding: 14px 16px; background: rgba(255,255,255,0.03); border-radius: 12px;
  display: flex; align-items: flex-start; gap: 12; margin-bottom: 10;
}
.apt-weight {
  padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; white-space: nowrap;
}
.apt-weight-high { background: #ef444433; color: #fca5a5; }
.apt-weight-mid { background: #f59e0b33; color: #fcd34d; }
.apt-weight-low { background: #22c55e33; color: #86efac; }
.apt-text { color: #cbd5e1; font-size: 14px; line-height: 1.5; }

/* 전망 아이템 */
.outlook-item {
  padding: 16px; background: rgba(255,255,255,0.03); border-radius: 12px; margin-bottom: 12;
}
.outlook-head { display: flex; align-items: center; gap: 8; margin-bottom: 6; }
.outlook-icon { font-size: 18px; }
.outlook-label { color: #f1f5f9; font-size: 14px; font-weight: 700; }
.outlook-value { color: #94a3b8; font-size: 13px; padding-left: 30px; }

/* 과목 연결 */
.subj-item {
  display: flex; align-items: center; gap: 12; padding: 12px 16px;
  border-radius: 12px; margin-bottom: 10; cursor: pointer; transition: all 0.2s;
}
.subj-item:hover { opacity: 0.85; }
.subj-icon { font-size: 20px; }
.subj-name { font-size: 14px; font-weight: 700; }
.subj-reason { color: #94a3b8; font-size: 12px; }

/* 전공 버튼 */
.major-btn {
  padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.2s; font-family: inherit;
}

/* 경로 스텝 */
.path-step { display: flex; flex-direction: column; align-items: center; }
.path-box {
  border-radius: 16px; padding: 16px 32px; text-align: center; min-width: 220px;
}
.path-arrow {
  display: flex; flex-direction: column; align-items: center; padding: 4px 0;
}
.path-line { width: 2px; height: 16px; }

/* 과목 페이지 */
.subj-page-btn {
  padding: 10px 18px; border-radius: 12px; font-size: 14px; font-weight: 700;
  border: none; cursor: pointer; display: flex; align-items: center; gap: 6;
  transition: all 0.2s; font-family: inherit;
}
.subj-page-info {
  border-radius: 16px; padding: 24px; margin-bottom: 24; text-align: center;
}
.subj-job-item {
  background: #1e293b; border-radius: 14px; padding: 16px 20px;
  border: 1px solid rgba(255,255,255,0.06); cursor: pointer;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.2s; margin-bottom: 12px;
}
.subj-job-item:hover { border-color: rgba(255,255,255,0.15); }

/* 전공 페이지 */
.major-page-btn {
  padding: 8px 14px; border-radius: 10px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.major-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20; }
.major-subj-item {
  display: flex; align-items: center; gap: 10; padding: 10px 12px;
  background: rgba(99,102,241,0.08); border-radius: 10px; margin-bottom: 8px;
}
.major-subj-num {
  width: 24px; height: 24px; border-radius: 50%; background: #6366f1;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 11px; font-weight: 800; flex-shrink: 0;
}
.major-job-item {
  display: flex; align-items: center; gap: 12; padding: 12px 14px;
  background: rgba(255,255,255,0.03); border-radius: 10px; cursor: pointer;
  transition: all 0.2s; margin-bottom: 8px;
}
.major-job-item:hover { background: rgba(255,255,255,0.08); }

/* 경로 탐색 */
.path-job-btn {
  padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
  cursor: pointer; font-family: inherit; transition: all 0.2s;
  border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03); color: #94a3b8;
}
.path-job-btn.active { border: none; color: #fff; }

/* 뒤로가기 */
.back-btn {
  background: none; border: none; color: #60a5fa; cursor: pointer;
  font-size: 13px; margin-bottom: 16; display: flex; align-items: center; gap: 4;
  font-family: inherit;
}

/* 페이지 타이틀 */
.page-title { font-size: 28px; font-weight: 800; margin-bottom: 8px; }
.page-subtitle { color: #94a3b8; font-size: 14px; }
.section-title { color: #f1f5f9; font-size: 16px; font-weight: 700; margin-bottom: 16px; }

/* 경로 페이지 하단 그리드 */
.path-bottom-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16; margin-top: 20; }

/* 빈 상태 */
.empty-state { text-align: center; padding: 64px; color: #64748b; background: #1e293b; border-radius: 20px; }

/* 일일업무 아이템 */
.daily-item {
  display: flex; align-items: center; gap: 12; padding: 8px 12px; border-radius: 8px;
}
.daily-item:nth-child(odd) { background: rgba(255,255,255,0.03); }
.daily-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* 경로 단계 번호 */
.step-num {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 800; flex-shrink: 0;
}
.step-line { width: 2px; height: 24px; }

/* 반응형 */
@media (max-width: 768px) {
  .super-nav-link { padding: 12px 10px; font-size: 11px; }
  .super-nav-logo { margin-right: 12px; }
  .super-nav-logo span:last-child { font-size: 13px; }
  .major-grid { grid-template-columns: 1fr; }
  .path-bottom-grid { grid-template-columns: 1fr; }
  .salary-grid { grid-template-columns: 1fr; }
  .page-title { font-size: 22px; }
  .nav-logo-text { font-size: 15px; }
  .nav-tab span:last-child { display: none; }
}

/* 페이드 인 애니메이션 */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
.fade-in { animation: fadeIn 0.3s ease; }
</style>
</head>

// ═══════════════════════════════════════
// 상태 관리
// ═══════════════════════════════════════
let currentPage = { type: "dashboard" };
let dashboardFilter = "전체";
let dashboardSearch = "";
let detailTab = "info";

function navigate(type, data) {
  if (type === "dashboard") currentPage = { type: "dashboard" };
  else if (type === "detail") { currentPage = { type: "detail", job: data }; detailTab = "info"; }
  else if (type === "subject") currentPage = { type: "subject", selected: data || "수학" };
  else if (type === "major") currentPage = { type: "major", selected: data || Object.keys(MAJORS)[0] };
  else if (type === "path") currentPage = { type: "path", selected: data || null };
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ═══════════════════════════════════════
// 렌더링
// ═══════════════════════════════════════
function render() {
  renderNav();
  const app = document.getElementById("app");
  if (currentPage.type === "dashboard") app.innerHTML = renderDashboard();
  else if (currentPage.type === "detail") app.innerHTML = renderDetail();
  else if (currentPage.type === "subject") app.innerHTML = renderSubjectPage();
  else if (currentPage.type === "major") app.innerHTML = renderMajorPage();
  else if (currentPage.type === "path") app.innerHTML = renderPathPage();
  app.className = "fade-in";
  bindEvents();
}

function renderNav() {
  const tabs = [
    { id:"dashboard", label:"대시보드", icon:"🧭" },
    { id:"subject", label:"과목 연결", icon:"📐" },
    { id:"major", label:"전공 탐색", icon:"🎓" },
    { id:"path", label:"경로 탐색", icon:"🗺️" },
  ];
  document.getElementById("navTabs").innerHTML = tabs.map(t =>
    `<button class="nav-tab ${currentPage.type===t.id?'active':''}" onclick="navigate('${t.id}')">
      <span style="font-size:15px">${t.icon}</span><span>${t.label}</span>
    </button>`
  ).join("");
}

// ── 대시보드 ──
function renderDashboard() {
  const cats = ["전체", ...Object.keys(CATEGORIES)];
  const filtered = JOBS.filter(j => {
    if (dashboardFilter !== "전체" && j.category !== dashboardFilter) return false;
    if (dashboardSearch && !j.name.includes(dashboardSearch) && !j.oneliner.includes(dashboardSearch) && !j.category.includes(dashboardSearch)) return false;
    return true;
  });
  return `
    <div class="container">
      <div style="text-align:center;margin-bottom:32px">
        <h1 class="page-title">어떤 직업이 나를 기다리고 있을까?</h1>
        <p class="page-subtitle">20개 직업을 탐색하고, 공부와 미래를 연결해 보세요</p>
      </div>
      <div style="display:flex;justify-content:center;margin-bottom:20px">
        <input class="search-box" id="searchBox" value="${dashboardSearch}" placeholder="직업 이름, 키워드로 검색..." />
      </div>
      <div class="filter-group">
        ${cats.map(c => {
          const isActive = dashboardFilter === c;
          const bg = isActive ? (c==="전체" ? "linear-gradient(135deg,#60a5fa,#a78bfa)" : CATEGORIES[c].color) : "transparent";
          return `<button class="filter-btn ${isActive?'active':''}" style="background:${bg}${isActive?';color:#fff':''}" onclick="setFilter('${c}')">${c!=="전체"?CATEGORIES[c].icon+" ":""}${c}</button>`;
        }).join("")}
      </div>
      <div class="card-grid">
        ${filtered.map(j => {
          const cat = CATEGORIES[j.category];
          return `
          <div class="job-card" onclick="navigate('detail','${j.name}')" onmouseenter="this.style.boxShadow='0 12px 32px ${cat.color}22';this.style.borderColor='${cat.color}44'" onmouseleave="this.style.boxShadow='none';this.style.borderColor='rgba(255,255,255,0.06)'">
            <div class="job-card-header">
              <div class="job-card-icon" style="background:${cat.color}22">${j.emoji}</div>
              <div>
                <div class="job-card-name">${j.name}</div>
                <div class="job-card-cat" style="color:${cat.color}">${cat.icon} ${j.category}</div>
              </div>
            </div>
            <div class="job-card-desc">${j.oneliner}</div>
            <div class="job-card-tags">
              ${Object.keys(j.subjects).slice(0,3).map(s => `<span class="job-card-tag">${s}</span>`).join("")}
            </div>
            <div class="job-card-salary">💰 ${j.salary.entry}만</div>
          </div>`;
        }).join("")}
      </div>
      ${filtered.length === 0 ? '<div style="text-align:center;padding:48px;color:#64748b">검색 결과가 없습니다</div>' : ''}
    </div>`;
}

// ── 직업 상세 ──
function renderDetail() {

  const tabs = [{id:"info",label:"기본 정보"},{id:"salary",label:"연봉·트렌드"},{id:"aptitude",label:"적성·성향"},{id:"outlook",label:"미래 전망"},{id:"connect",label:"과목·전공 연결"}];

  let content = "";
  if (detailTab === "info") {
    content = `
      <h3 class="section-title">실제 하는 일</h3>

      ${job.dailyWork.map((item,i) => `
        <div class="daily-item"><div class="daily-dot" style="background:${cat.color}"></div><span style="color:#cbd5e1;font-size:13px">${item}</span></div>

  } else if (detailTab === "salary") {
    content = `
      <h3 class="section-title">💰 연봉 정보 (만원)</h3>
      <div class="salary-grid">
        <div class="salary-box" style="background:#60a5fa11;border:1px solid #60a5fa22"><div class="salary-label">초봉</div><div class="salary-value" style="color:#60a5fa">${job.salary.entry}</div></div>
        <div class="salary-box" style="background:#a78bfa11;border:1px solid #a78bfa22"><div class="salary-label">5년차</div><div class="salary-value" style="color:#a78bfa">${job.salary.mid}</div></div>
        <div class="salary-box" style="background:#f472b611;border:1px solid #f472b622"><div class="salary-label">10년차+</div><div class="salary-value" style="color:#f472b6">${job.salary.senior}</div></div>
      </div>
      <div style="color:#64748b;font-size:11px;margin-bottom:24px">※ 출처: ${job.salarySource}</div>
      <h3 class="section-title">📊 최근 채용 트렌드</h3>
      ${job.trends.map(t => `
        <div class="trend-item">
          <span class="trend-label">${t.label}</span>
          <span class="trend-icon">${t.direction==="up"?"📈":t.direction==="down"?"📉":"➡️"}</span>
        </div>`).join("")}`;
  } else if (detailTab === "aptitude") {
    content = `
      <h3 class="section-title">🎯 적성 체크리스트</h3>
      <p style="color:#94a3b8;font-size:13px;margin-bottom:16px">나와 맞는 직업인지 스스로 체크해 보세요</p>
      ${job.aptitude.map(a => `
        <div class="apt-item">
          <span class="apt-weight ${a.weight==="높음"?"apt-weight-high":a.weight==="중간"?"apt-weight-mid":"apt-weight-low"}">${a.weight}</span>
          <span class="apt-text">${a.q}</span>
        </div>`).join("")}`;
  } else if (detailTab === "outlook") {
    content = `
      <h3 class="section-title">🔮 향후 전망</h3>
      ${[{icon:"🤖",label:"AI 대체 가능성",value:job.outlook.aiReplace},
         {icon:"🌏",label:"해외 취업",value:job.outlook.overseas},
         {icon:"💼",label:"프리랜서 가능",value:job.outlook.freelance},
         {icon:"🏠",label:"원격근무",value:job.outlook.remote}
      ].map(o => `
        <div class="outlook-item">
          <div class="outlook-head"><span class="outlook-icon">${o.icon}</span><span class="outlook-label">${o.label}</span></div>
          <div class="outlook-value">${o.value}</div>
        </div>`).join("")}`;
  } else if (detailTab === "connect") {
    content = `
      <h3 class="section-title">📚 고등학교 과목 연결</h3>
      ${Object.entries(job.subjects).map(([s,r]) => {
        const subj = SUBJECTS[s] || {icon:"📖",color:"#6366f1"};
        return `<div class="subj-item" style="background:${subj.color}11;border:1px solid ${subj.color}22" onclick="navigate('subject','${s}')">

          <div style="color:#cbd5e1;font-size:14px;padding-top:4px">${step}</div>

  }

  return `
    <div class="container-sm">
      <button class="back-btn" onclick="navigate('dashboard')">← 목록으로</button>
      <div class="detail-header" style="background:linear-gradient(135deg,${cat.color}22,${cat.color}08);border:1px solid ${cat.color}33">
        <div class="detail-header-row">
          <div class="detail-icon" style="background:${cat.color}33">${job.emoji}</div>
          <div>
            <h2 class="detail-title">${job.name}</h2>
            <div class="detail-cat" style="color:${cat.color}">${cat.icon} ${job.category}</div>
          </div>
        </div>
        <p class="detail-oneliner">${job.oneliner}</p>
      </div>
      <div class="tab-group">
        ${tabs.map(t => `<button class="tab-btn ${detailTab===t.id?'active':''}" style="${detailTab===t.id?'background:'+cat.color:''}" onclick="setDetailTab('${t.id}')">${t.label}</button>`).join("")}

      <div class="panel">${content}</div>

  return `
    <div class="container-md">
      <div style="text-align:center;margin-bottom:28px">
        <h2 class="page-title" style="font-size:24px">"이 과목, 왜 배우는 거예요?"</h2>
        <p class="page-subtitle">과목을 선택하면 연결된 직업을 볼 수 있어요</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px">
        ${Object.entries(SUBJECTS).map(([name,info]) =>

        <div class="panel">
          <h3 class="section-title" style="margin-top:0">📖 배우는 과목</h3>
          ${major.subjects.map((s,i) =>
            `<div class="major-subj-item"><div class="major-subj-num">${i+1}</div><span style="color:#cbd5e1;font-size:14px">${s}</span></div>`
          ).join("")}
        </div>
        <div class="panel">
          <h3 class="section-title" style="margin-top:0">💼 연결된 직업</h3>
          ${major.jobs.map(jName => {
            const j = JOBS.find(job => job.name === jName);
            if (!j) return '';
            return `<div class="major-job-item" onclick="navigate('detail','${jName}')">
              <span style="font-size:24px">${j.emoji}</span>
              <div>
                <div style="color:#f1f5f9;font-size:14px;font-weight:700">${j.name}</div>
                <div style="color:#64748b;font-size:11px">💰 초봉 ${j.salary.entry}만</div>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
    </div>`;
}

// ── 경로 탐색 ──
function renderPathPage() {
  const selected = currentPage.selected;
  const job = JOBS.find(j => j.name === selected);

  let pathContent = '';
  if (job) {
    const cat = CATEGORIES[job.category];
    pathContent = `
      <div class="panel" style="border-radius:20px;padding:32px;margin-bottom:20px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:0">
          ${job.path.map((step,i) => {
            const isLast = i === job.path.length - 1;
            const isFirst = i === 0;
            return `
              <div class="path-step">
                <div class="path-box" style="background:${isLast?`linear-gradient(135deg,${cat.color},${cat.color}cc)`:isFirst?'rgba(96,165,250,0.15)':'rgba(255,255,255,0.05)'};border:${isLast?`2px solid ${cat.color}`:'1px solid rgba(255,255,255,0.08)'}">
                  <div style="color:${isLast?'#fff':'#f1f5f9'};font-size:${isLast?'16':'14'}px;font-weight:${isLast?800:600}">${step}</div>
                </div>
                ${i < job.path.length-1 ? `<div class="path-arrow"><div class="path-line" style="background:${cat.color}44"></div><span style="color:${cat.color};font-size:16px">▼</span><div style="width:2px;height:4px;background:${cat.color}44"></div></div>` : ''}
              </div>`;
          }).join("")}
        </div>
      </div>
      <div class="path-bottom-grid">
        <div class="panel" style="padding:20px">
          <h4 style="color:#60a5fa;font-size:14px;font-weight:700;margin:0 0 12px">📚 지금 중요한 과목</h4>
          ${Object.entries(job.subjects).map(([s,r]) => {
            const subj = SUBJECTS[s] || {icon:"📖",color:"#6366f1"};
            return `<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;cursor:pointer" onclick="navigate('subject','${s}')">
              <span>${subj.icon}</span>
              <span style="color:#cbd5e1;font-size:13px"><b style="color:${subj.color}">${s}</b> — ${r}</span>
            </div>`;
          }).join("")}
        </div>
        <div class="panel" style="padding:20px">
          <h4 style="color:#a78bfa;font-size:14px;font-weight:700;margin:0 0 12px">🎓 추천 전공</h4>
          ${(job.majors||[]).map(m => `
            <div style="padding:8px 12px;background:rgba(167,139,250,0.1);border-radius:8px;margin-bottom:8px;cursor:pointer;color:#cbd5e1;font-size:13px" onclick="navigate('major','${m}')">
              ${m} → ${MAJORS[m]?.subjects.slice(0,3).join(", ")}...
            </div>`).join("")}
        </div>
      </div>`;
  } else {
    pathContent = `<div class="empty-state"><span style="font-size:48px;display:block;margin-bottom:12px">👆</span>위에서 직업을 선택하면 진로 경로를 볼 수 있어요</div>`;
  }

  return `
    <div class="container-md">
      <div style="text-align:center;margin-bottom:28px">
        <h2 class="page-title" style="font-size:24px">🗺️ 진로 경로 탐색기</h2>
        <p class="page-subtitle">고등학교 공부 → 대학 전공 → 직업까지의 경로를 확인하세요</p>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:32px">
        ${JOBS.map(j => `<button class="path-job-btn ${selected===j.name?'active':''}" style="${selected===j.name?'background:'+CATEGORIES[j.category].color+';border:none;color:#fff':''}" onclick="navigate('path','${j.name}')">${j.emoji} ${j.name}</button>`).join("")}
      </div>
      ${pathContent}
    </div>`;
}

// ═══════════════════════════════════════
// 이벤트 바인딩
// ═══════════════════════════════════════
function bindEvents() {
  const searchBox = document.getElementById("searchBox");
  if (searchBox) {
    searchBox.addEventListener("input", (e) => {
      dashboardSearch = e.target.value;
      document.querySelector(".card-grid").outerHTML = renderDashboard().match(/<div class="card-grid">[\s\S]*?<\/div>\s*<\/div>/)?.[0] || '';
      // 간단히 전체 재렌더
      const app = document.getElementById("app");
      app.innerHTML = renderDashboard();
      bindEvents();
      document.getElementById("searchBox").focus();
      document.getElementById("searchBox").setSelectionRange(dashboardSearch.length, dashboardSearch.length);
    });
  }
}

function setFilter(f) {
  dashboardFilter = f;
  const app = document.getElementById("app");
  app.innerHTML = renderDashboard();
  bindEvents();
}

function setDetailTab(t) {
  detailTab = t;
  const app = document.getElementById("app");
  app.innerHTML = renderDetail();
  bindEvents();
}

// 초기 렌더
render();
</script>
</body>
</html>
